<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mobile Brick Breaker</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg-top: #101626;
      --bg-bottom: #05070f;
      --text: #eef4ff;
      --app-height: 100vh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: var(--app-height);
      margin: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(72, 116, 255, 0.32), transparent 34rem),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #game {
      width: 100%;
      height: 100%;
      height: var(--app-height);
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      pointer-events: auto;
    }

    #game canvas {
      display: block;
      touch-action: none;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Phaser 벽돌깨기 게임"></main>

  <script>
    (() => {
      let lockedHeight = window.innerHeight;
      window.brickBreakerGame = null;

      const refreshGameScale = () => {
        window.brickBreakerGame?.scale?.refresh();
      };

      const isTyping = () => {
        const element = document.activeElement;
        return element && ["INPUT", "TEXTAREA", "SELECT"].includes(element.tagName);
      };

      const applyHeight = (height) => {
        lockedHeight = height;
        document.documentElement.style.setProperty("--app-height", `${lockedHeight}px`);
      };

      const syncHeight = () => {
        if (!isTyping()) {
          applyHeight(window.innerHeight);
        }

        window.scrollTo(0, 0);
        refreshGameScale();
      };

      applyHeight(lockedHeight);
      window.addEventListener("resize", syncHeight, { passive: true });
      window.addEventListener("orientationchange", syncHeight, { passive: true });
      window.visualViewport?.addEventListener("resize", () => {
        if (isTyping()) {
          document.documentElement.style.setProperty("--app-height", `${lockedHeight}px`);
          window.scrollTo(0, 0);
          refreshGameScale();
          return;
        }

        syncHeight();
      });
    })();
  </script>

  <script type="text/plain" id="legacy-game-script">
    const GAME_WIDTH = 390;
    const GAME_HEIGHT = 844;
    const PADDLE_Y = 752;
    const SAFE_BOTTOM = 22;
    const BASE_BALL_SPEED = 410;
    const MAX_ACTIVE_BALLS = 6;
    const STORAGE_KEY = "brickBreakerBest";
    const ASSET_PATH = "PNG/Default/";
    const BRICK_TEXTURES = [
      "element_purple_rectangle",
      "element_blue_rectangle",
      "element_green_rectangle",
      "element_yellow_rectangle",
      "element_red_rectangle",
      "element_grey_rectangle"
    ];
    const BRICK_PARTICLE_COLORS = {
      element_purple_rectangle: 0xa879ff,
      element_blue_rectangle: 0x72f6ff,
      element_green_rectangle: 0x5cff9d,
      element_yellow_rectangle: 0xffcf5a,
      element_red_rectangle: 0xff4d8d,
      element_grey_rectangle: 0xcbd4e6
    };
    const POWER_UPS = [
      { effect: "expand", label: "PADDLE UP!", texture: "powerUp_expand", file: "element_green_diamond_glossy.png" },
      { effect: "multiBall", label: "MULTI BALL!", texture: "powerUp_multiBall", file: "element_blue_diamond_glossy.png" },
      { effect: "fireball", label: "FIREBALL!", texture: "powerUp_fireball", file: "element_red_diamond_glossy.png" }
    ];
    const BACKGROUND_PALETTES = [
      { base: 0x070a14, glowA: 0x2c7dff, glowB: 0x6b5cff, glowC: 0x111a38 },
      { base: 0x100817, glowA: 0xff5aa5, glowB: 0x7c5cff, glowC: 0x251236 },
      { base: 0x061311, glowA: 0x2fffd0, glowB: 0x1f8cff, glowC: 0x0d302c },
      { base: 0x141006, glowA: 0xffcf5a, glowB: 0xff6b4a, glowC: 0x32250c },
      { base: 0x080f1c, glowA: 0x72f6ff, glowB: 0x2f8cff, glowC: 0x102b46 },
      { base: 0x110b0f, glowA: 0xff7f9f, glowB: 0xff4d5e, glowC: 0x32141c }
    ];

    class BrickBreakerScene extends Phaser.Scene {
      constructor() {
        super("BrickBreakerScene");
        this.score = 0;
        this.stage = 1;
        this.speedMultiplier = 1;
        this.bestStage = 1;
        this.bestScore = 0;
        this.gameEnded = false;
        this.transitioningStage = false;
      }

      preload() {
        this.load.image("paddle", `${ASSET_PATH}paddleRed.png`);
        this.load.image("ball", `${ASSET_PATH}ballBlue.png`);
        POWER_UPS.forEach((powerUp) => {
          this.load.image(powerUp.texture, `${ASSET_PATH}${powerUp.file}`);
        });

        BRICK_TEXTURES.forEach((texture) => {
          this.load.image(texture, `${ASSET_PATH}${texture}.png`);
        });
      }

      create() {
        const best = this.loadBestStats();
        this.score = 0;
        this.stage = 1;
        this.speedMultiplier = 1;
        this.bestStage = best.stage;
        this.bestScore = best.score;
        this.gameEnded = false;
        this.transitioningStage = false;

        this.createBackground();
        this.createHud();
        this.createWorld();
        this.createBricks();
        this.createControls();
        this.showStartPrompt();
      }

      update(time, delta) {
        if (this.gameEnded || !this.balls) {
          return;
        }

        this.balls.children.each((ball) => {
          if (!ball.active) {
            return;
          }

          if (ball.getData("attached")) {
            ball.setPosition(this.paddle.x, PADDLE_Y - BALL_ATTACH_OFFSET_Y);
            return;
          }

          if (ball.y > GAME_HEIGHT + ball.displayHeight) {
            ball.destroy();
            return;
          }

          this.handlePaddleCollision(ball);

          // 너무 수직으로만 움직이면 플레이가 단조로워져 약간의 수평 속도를 보정한다.
          if (ball.body.velocity.length() > 0 && Math.abs(ball.body.velocity.x) < 70) {
            ball.setVelocityX(ball.body.velocity.x < 0 ? -100 : 100);
          }
        });

        this.powerUps.children.each((powerUp) => {
          if (powerUp.active && powerUp.y > GAME_HEIGHT + powerUp.displayHeight) {
            powerUp.destroy();
          }
        });

        if (this.countActiveBalls() === 0 && !this.transitioningStage) {
          this.endGame(false);
        }
      }

      createBackground() {
        this.bgRect = this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x070a14).setOrigin(0);
        this.bgGlow = this.add.graphics();
        this.bgPanel = this.add.graphics();
        this.applyRandomBackground();
      }

      applyRandomBackground() {
        let paletteIndex = Phaser.Math.Between(0, BACKGROUND_PALETTES.length - 1);

        if (BACKGROUND_PALETTES.length > 1 && paletteIndex === this.lastBackgroundIndex) {
          paletteIndex = (paletteIndex + 1) % BACKGROUND_PALETTES.length;
        }

        this.lastBackgroundIndex = paletteIndex;
        const palette = BACKGROUND_PALETTES[paletteIndex];

        this.bgRect.setFillStyle(palette.base, 1);
        this.bgGlow.clear();
        this.bgGlow.fillGradientStyle(palette.glowA, palette.glowB, palette.glowC, palette.base, 0.44, 0.24, 0.04, 0);
        this.bgGlow.fillCircle(GAME_WIDTH / 2, 88, 260);

        this.bgPanel.clear();
        this.bgPanel.lineStyle(1, 0xffffff, 0.08);
        this.bgPanel.fillStyle(0xffffff, 0.035);
        this.bgPanel.fillRoundedRect(18, 18, GAME_WIDTH - 36, GAME_HEIGHT - 36 - SAFE_BOTTOM, 28);
        this.bgPanel.strokeRoundedRect(18, 18, GAME_WIDTH - 36, GAME_HEIGHT - 36 - SAFE_BOTTOM, 28);
      }

      createHud() {
        this.add.text(32, 36, "BRICK BREAKER", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "14px",
          fontStyle: "700",
          color: "#9fb3ff",
          letterSpacing: 2
        });

        this.stageText = this.add.text(GAME_WIDTH / 2, 36, "Stage 1", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "18px",
          fontStyle: "800",
          color: "#ffffff"
        }).setOrigin(0.5, 0);

        this.scoreText = this.add.text(GAME_WIDTH - 32, 34, "0", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "28px",
          fontStyle: "800",
          color: "#ffffff"
        }).setOrigin(1, 0);

        this.bestText = this.add.text(GAME_WIDTH / 2, 62, "", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "12px",
          fontStyle: "700",
          color: "#8ea2d8"
        }).setOrigin(0.5, 0);
        this.updateBestText();

        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT - 54, "드래그해서 패들을 움직이세요", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "13px",
          color: "#93a1c7"
        }).setOrigin(0.5);
      }

      createWorld() {
        this.physics.world.setBounds(24, 24, GAME_WIDTH - 48, GAME_HEIGHT + 80, true, true, true, false);

        this.paddle = this.physics.add.staticImage(GAME_WIDTH / 2, PADDLE_Y, "paddle")
          .setDisplaySize(128, 24)
          .setDepth(5);
        this.paddle.refreshBody();
        this.paddle.body.setSize(this.paddle.width, this.paddle.height * 0.62, true);

        this.balls = this.physics.add.group();
        this.ball = this.createBall(GAME_WIDTH / 2, PADDLE_Y - BALL_ATTACH_OFFSET_Y, true);
        this.bricks = this.physics.add.staticGroup();
        this.powerUps = this.physics.add.group();

        this.physics.add.collider(this.balls, this.bricks, this.hitBrick, null, this);
        this.physics.add.overlap(this.paddle, this.powerUps, this.collectPowerUp, null, this);
      }

      createBall(x, y, attached = false, velocity = null) {
        const ball = this.balls.create(x, y, "ball")
          .setDisplaySize(24, 24)
          .setBounce(1)
          .setCollideWorldBounds(true)
          .setDepth(6);

        ball.body.allowGravity = false;
        ball.body.setCircle(Math.min(ball.width, ball.height) / 2);
        ball.setData("attached", attached);
        this.setBallFireball(ball, this.fireballActive);

        if (velocity) {
          ball.setVelocity(velocity.x, velocity.y);
        }

        return ball;
      }

      createBallTrail(ball) {
        const prevX = ball.getData("trailX");
        const prevY = ball.getData("trailY");

        ball.setData("trailX", ball.x);
        ball.setData("trailY", ball.y);

        if (!Number.isFinite(prevX) || !Number.isFinite(prevY)) return;
        if (Phaser.Math.Distance.Between(prevX, prevY, ball.x, ball.y) < 2) return;

        const lastTrailAt = ball.getData("lastTrailAt") || 0;
        if (this.time.now - lastTrailAt < 32) return;
        ball.setData("lastTrailAt", this.time.now);

        const trail = this.add.graphics().setDepth(4);
        trail.lineStyle(5, 0x72f6ff, 0.22);
        trail.beginPath();
        trail.moveTo(prevX, prevY);
        trail.lineTo(ball.x, ball.y);
        trail.strokePath();
        trail.fillStyle(0x72f6ff, 0.14);
        trail.fillCircle(ball.x, ball.y, 8);

        this.tweens.add({
          targets: trail,
          alpha: 0,
          duration: 200,
          ease: "Sine.easeOut",
          onComplete: () => trail.destroy()
        });
      }

      createBricks() {
        if (this.bricks) {
          this.bricks.clear(true, true);
        }

        const rows = Phaser.Math.Clamp(5 + Math.floor((this.stage - 1) / 2), 5, 8);
        const cols = 5;
        const brickWidth = 62;
        const brickHeight = 28;
        const gapX = 9;
        const gapY = 10;
        const startX = (GAME_WIDTH - ((cols - 1) * (brickWidth + gapX))) / 2;
        const startY = 132;
        const positions = [];

        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            positions.push({
              x: startX + col * (brickWidth + gapX),
              y: startY + row * (brickHeight + gapY)
            });
          }
        }

        this.shuffleArray(positions);

        const minimumBricks = Math.min(18 + this.stage, positions.length);
        const brickCount = Phaser.Math.Between(minimumBricks, positions.length);

        for (let index = 0; index < brickCount; index += 1) {
          const position = positions[index];
          const texture = BRICK_TEXTURES[Phaser.Math.Between(0, BRICK_TEXTURES.length - 1)];
          const brick = this.bricks.create(position.x, position.y, texture)
            .setDisplaySize(brickWidth, brickHeight)
            .setAlpha(0.96);
          const hp = this.getBrickHp();

          brick.setData("hp", hp);
          brick.setData("maxHp", hp);
          brick.refreshBody();
          this.updateBrickHpVisual(brick);
        }
      }

      createControls() {
        this.input.on("pointermove", (pointer) => {
          if (!pointer.isDown || this.gameEnded || this.transitioningStage) {
            return;
          }

          this.movePaddle(pointer.x);
        });

        this.input.on("pointerdown", (pointer) => {
          if (this.transitioningStage) {
            return;
          }

          if (this.gameEnded) {
            this.scene.restart();
            return;
          }

          this.movePaddle(pointer.x);

          if (this.ball && this.ball.active && this.ball.getData("attached")) {
            this.launchBall();
          }
        });
      }

      movePaddle(x) {
        const half = this.paddle.displayWidth / 2;
        const clampedX = Phaser.Math.Clamp(x, 32 + half, GAME_WIDTH - 32 - half);
        this.paddle.setPosition(clampedX, PADDLE_Y);
        this.paddle.refreshBody();

        if (this.ball && this.ball.active && this.ball.getData("attached")) {
          this.ball.setX(clampedX);
        }
      }

      launchBall() {
        if (!this.ball || !this.ball.active) {
          return;
        }

        this.ball.setData("attached", false);
        const speed = this.getStageBallSpeed();
        this.ball.setVelocity(Phaser.Math.Between(-130, 130), -speed);

        if (this.startPrompt) {
          this.tweens.add({
            targets: this.startPrompt,
            alpha: 0,
            duration: 180,
            onComplete: () => {
              this.startPrompt.destroy();
              this.startPrompt = null;
            }
          });
        }
      }

      handlePaddleCollision(ball) {
        if (!ball.active || ball.body.velocity.y <= 0) {
          return;
        }

        const paddleTop = this.paddle.y - this.paddle.displayHeight / 2;
        const paddleBottom = this.paddle.y + this.paddle.displayHeight / 2;
        const ballBottom = ball.y + ball.displayHeight / 2;
        const horizontalReach = this.paddle.displayWidth / 2 + ball.displayWidth / 2;
        const isTouchingPaddle =
          ballBottom >= paddleTop &&
          ball.y <= paddleBottom &&
          Math.abs(ball.x - this.paddle.x) <= horizontalReach;

        if (!isTouchingPaddle) {
          return;
        }

        const lastPaddleHitAt = ball.getData("lastPaddleHitAt") || 0;

        if (this.time.now - lastPaddleHitAt < 90) {
          return;
        }

        ball.setData("lastPaddleHitAt", this.time.now);

        const offset = (ball.x - this.paddle.x) / (this.paddle.displayWidth / 2);
        const velocity = ball.body.velocity;
        const speed = Math.max(this.getStageBallSpeed(), Math.hypot(velocity.x, velocity.y));
        const angle = Phaser.Math.Clamp(offset, -0.95, 0.95) * 1.05;
        const safeY = paddleTop - ball.displayHeight / 2 - 2;

        ball.body.reset(ball.x, safeY);
        ball.setVelocity(Math.sin(angle) * speed, -Math.cos(angle) * speed);
      }

      hitBrick(ball, brick) {
        const lastHitAt = brick.getData("lastHitAt") || 0;

        if (this.time.now - lastHitAt < 70) {
          return;
        }

        brick.setData("lastHitAt", this.time.now);

        const nextHp = brick.getData("hp") - 1;
        brick.setData("hp", nextHp);

        if (nextHp > 0) {
          this.score += 2;
          this.scoreText.setText(String(this.score));
          this.saveBestStats();
          this.updateBrickHpVisual(brick);
          this.tweens.add({
            targets: brick,
            scaleX: 0.94,
            scaleY: 0.94,
            duration: 55,
            yoyo: true,
            ease: "Quad.easeOut"
          });
          this.cameras.main.shake(35, 0.0015);
          return;
        }

        this.score += 10 * brick.getData("maxHp");
        this.scoreText.setText(String(this.score));
        this.saveBestStats();

        this.tweens.add({
          targets: brick,
          scaleX: 1.12,
          scaleY: 1.12,
          alpha: 0,
          duration: 120,
          ease: "Quad.easeOut",
          onComplete: () => {
            this.maybeDropPowerUp(brick.x, brick.y, brick.getData("maxHp"));
            brick.disableBody(true, true);

            if (this.bricks.countActive(true) === 0) {
              this.startNextStage();
            }
          }
        });

        this.cameras.main.shake(55, 0.0025);
      }

      getStageBallSpeed() {
        return BASE_BALL_SPEED * this.speedMultiplier;
      }

      getBrickHp() {
        if (this.stage === 1) {
          return 1;
        }

        const maxHp = Phaser.Math.Clamp(1 + Math.floor(this.stage / 2), 2, 6);
        const durableChance = Phaser.Math.Clamp(0.18 + this.stage * 0.06, 0.24, 0.72);

        return Math.random() < durableChance ? Phaser.Math.Between(2, maxHp) : 1;
      }

      updateBrickHpVisual(brick) {
        const hp = brick.getData("hp");
        const maxHp = brick.getData("maxHp");

        // HP 숫자는 숨기고, 맞을수록 살짝 흐려지게만 표현한다.
        brick.setAlpha(0.72 + (hp / maxHp) * 0.24);
      }

      maybeDropPowerUp(x, y, brickHp) {
        if (this.stage < 2 || this.gameEnded || this.transitioningStage) {
          return;
        }

        const baseChance = brickHp > 1 ? 0.2 : 0.09;
        const dropChance = Phaser.Math.Clamp(baseChance + this.stage * 0.015, 0.1, 0.34);

        if (Math.random() > dropChance) {
          return;
        }

        const powerUp = this.powerUps.create(x, y, "multiBallItem")
          .setDisplaySize(34, 34)
          .setDepth(7);

        powerUp.body.allowGravity = false;
        powerUp.setVelocityY(125);
        powerUp.setData("type", "multiBall");
      }

      collectPowerUp(paddle, powerUp) {
        if (!powerUp.active || powerUp.getData("type") !== "multiBall") {
          return;
        }

        powerUp.destroy();
        this.activateMultiBall();
      }

      activateMultiBall() {
        const source = this.getMovingBall();

        if (!source || this.countActiveBalls() >= MAX_ACTIVE_BALLS) {
          return;
        }

        const speed = Math.max(this.getStageBallSpeed(), source.body.velocity.length());
        const sourceAngle = source.body.velocity.y > 0
          ? -Math.PI / 2
          : Phaser.Math.Angle.Between(0, 0, source.body.velocity.x, source.body.velocity.y);
        const angles = [sourceAngle - 0.45, sourceAngle + 0.45];

        angles.forEach((angle) => {
          if (this.countActiveBalls() >= MAX_ACTIVE_BALLS) {
            return;
          }

          this.createBall(source.x, source.y, false, {
            x: Math.cos(angle) * speed,
            y: Math.sin(angle) * speed
          });
        });

        this.showFloatingText(source.x, source.y - 28, "MULTI BALL!");
      }

      getMovingBall() {
        return this.balls.getChildren().find((ball) => {
          return ball.active && !ball.getData("attached") && ball.body.velocity.length() > 0;
        });
      }

      countActiveBalls() {
        return this.balls.getChildren().filter((ball) => ball.active).length;
      }

      showFloatingText(x, y, text) {
        const label = this.add.text(x, y, text, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "16px",
          fontStyle: "900",
          color: "#72f6ff",
          stroke: "#11182b",
          strokeThickness: 4
        }).setOrigin(0.5).setDepth(14);

        this.tweens.add({
          targets: label,
          y: y - 34,
          alpha: 0,
          duration: 680,
          ease: "Quad.easeOut",
          onComplete: () => label.destroy()
        });
      }

      startNextStage() {
        if (this.transitioningStage || this.gameEnded) {
          return;
        }

        this.transitioningStage = true;
        this.balls.children.each((ball) => {
          if (ball.active) {
            ball.setVelocity(0, 0);
          }
        });
        this.powerUps.clear(true, true);

        const speedIncrease = Phaser.Math.FloatBetween(1.05, 1.1);
        const message = this.showStageMessage(`${this.getStageLabel()} Clear`, "다음 단계 준비 중...");

        this.time.delayedCall(950, () => {
          message.destroy();
          this.stage += 1;
          this.speedMultiplier *= speedIncrease;
          this.stageText.setText(`Stage ${this.stage}`);
          this.saveBestStats();
          this.applyRandomBackground();
          this.createBricks();
          this.resetBallAndPaddle();
          this.transitioningStage = false;
          this.showStartPrompt(this.getStageLabel(), "터치해서 다음 단계 시작");
        });
      }

      resetBallAndPaddle() {
        this.paddle.setPosition(GAME_WIDTH / 2, PADDLE_Y);
        this.paddle.refreshBody();
        this.balls.clear(true, true);
        this.powerUps.clear(true, true);
        this.ball = this.createBall(GAME_WIDTH / 2, PADDLE_Y - BALL_ATTACH_OFFSET_Y, true);
      }

      showStageMessage(titleText, descText) {
        const message = this.add.container(GAME_WIDTH / 2, 482).setDepth(15);
        const card = this.add.graphics();
        card.fillStyle(0x11182b, 0.9);
        card.lineStyle(1, 0xffffff, 0.12);
        card.fillRoundedRect(-132, -46, 264, 92, 22);
        card.strokeRoundedRect(-132, -46, 264, 92, 22);

        const title = this.add.text(0, -13, titleText, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "22px",
          fontStyle: "800",
          color: "#72f6ff"
        }).setOrigin(0.5);

        const desc = this.add.text(0, 20, descText, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "13px",
          color: "#aebbf0"
        }).setOrigin(0.5);

        message.add([card, title, desc]);
        return message;
      }

      shuffleArray(items) {
        for (let index = items.length - 1; index > 0; index -= 1) {
          const swapIndex = Phaser.Math.Between(0, index);
          [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
        }

        return items;
      }

      loadBestStats() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);

          if (!raw) {
            return { stage: 1, score: 0 };
          }

          const parsed = JSON.parse(raw);

          return {
            stage: Math.max(1, Number(parsed.stage) || 1),
            score: Math.max(0, Number(parsed.score) || 0)
          };
        } catch (error) {
          return { stage: 1, score: 0 };
        }
      }

      saveBestStats() {
        const nextBestStage = Math.max(this.bestStage, this.stage);
        const nextBestScore = Math.max(this.bestScore, this.score);

        if (nextBestStage === this.bestStage && nextBestScore === this.bestScore) {
          return;
        }

        this.bestStage = nextBestStage;
        this.bestScore = nextBestScore;
        this.updateBestText();

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            stage: this.bestStage,
            score: this.bestScore
          }));
        } catch (error) {
          // 일부 브라우저의 비공개 모드에서는 저장소 접근이 막힐 수 있다.
        }
      }

      updateBestText() {
        if (this.bestText) {
          this.bestText.setText(`BEST  Stage ${this.bestStage}  /  ${this.bestScore}`);
        }
      }

      showStartPrompt(titleText = "터치해서 시작", descText = "패들을 드래그해 공을 받아내세요") {
        if (this.startPrompt) {
          this.startPrompt.destroy();
        }

        this.startPrompt = this.add.container(GAME_WIDTH / 2, 482).setDepth(10);

        card.lineStyle(1, 0xffffff, 0.12);
        card.fillRoundedRect(-132, -46, 264, 92, 22);
        card.strokeRoundedRect(-132, -46, 264, 92, 22);

        const title = this.add.text(0, -13, titleText, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "22px",
          fontStyle: "800",
          color: "#ffffff"
        }).setOrigin(0.5);

        const desc = this.add.text(0, 20, descText, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "13px",
          color: "#aebbf0"
        }).setOrigin(0.5);

        this.startPrompt.add([card, title, desc]);
      }

      endGame(won) {
        if (this.gameEnded) {
          return;
        }

        this.gameEnded = true;
        this.saveBestStats();
        this.balls.children.each((ball) => {
          if (ball.active) {
            ball.setVelocity(0, 0);
          }
        });
        this.physics.pause();

        const overlay = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x03050d, 0.62)
          .setDepth(20);

        const card = this.add.graphics().setDepth(21);
        card.fillStyle(0x11182b, 0.94);
        card.lineStyle(1, 0xffffff, 0.13);
        card.fillRoundedRect(42, 318, GAME_WIDTH - 84, 188, 28);

          fontStyle: "900",
          color: won ? "#72f6ff" : "#ff7f9f"
        }).setOrigin(0.5).setDepth(22);

        });

    function applyProductGrant(productId, options = {}) {

      const catalog = IAP_CATALOG[productId];

      const entitlements = loadEntitlements();
      const shopState = loadShopState();

      if (catalog.type === "non_consumable" && !entitlements.ownedProducts.includes(productId)) {
        entitlements.ownedProducts.push(productId);
      }

      if (entitlements.ownedProducts.includes("remove_banner_forever") || entitlements.ownedProducts.includes("starter_pack_forever")) {
        entitlements.bannerRemoved = true;
      }

      if (entitlements.ownedProducts.includes("ball_blaze_forever") || entitlements.ownedProducts.includes("starter_pack_forever")) {
        shopState.unlocked.blaze = true;
      }

      if (entitlements.ownedProducts.includes("ball_thunder_forever") || entitlements.ownedProducts.includes("starter_pack_forever")) {
        shopState.unlocked.thunder = true;
      }

      if (catalog.ballId) {
        shopState.unlocked[catalog.ballId] = true;
        if (isNewPurchase) {
          shopState.equipped = catalog.ballId;
          clearRunBoost();
        }
      }

      if (isNewPurchase && catalog.coins) {
        saveCoins(loadCoins() + catalog.coins);
      }

      if (isNewPurchase && productId === "starter_pack_forever") {
        saveCoins(loadCoins() + 3000);

      if (isNewPurchase && catalog.runBoost) {
        const boostBall = shopState.equipped !== "default" ? shopState.equipped : "blaze";
        setRunBoostBallId(boostBall);
      }

      saveEntitlements(entitlements);
      saveShopState(shopState);
      return true;

      initialized: false,

      getPlugin() {

      },

      async initialize() {
        if (this.initialized) return;
        this.initialized = true;
        syncEntitlementsFromOwnedProducts();

        const plugin = this.getPlugin();
        if (!plugin?.isBillingSupported) return;

        try {
          const supported = await plugin.isBillingSupported();
          if (!supported?.isBillingSupported) return;

          const { products } = await plugin.getProducts({
            productIdentifiers: IAP_PRODUCT_IDS,
            productType: "inapp"
          });

          (products || []).forEach((product) => {
            this.products[product.identifier] = product;
          });

          await this.syncPurchases();
        } catch (error) {
          console.warn("PurchaseService initialize failed", error);
        }
      },

      async syncPurchases() {
        const plugin = this.getPlugin();
        if (!plugin?.getPurchases) return;

        try {
          const { purchases } = await plugin.getPurchases({ productType: "inapp" });
          (purchases || []).forEach((purchase) => {
            if (purchase.purchaseState && purchase.purchaseState !== "1") return;
            const entitlements = loadEntitlements();
            const catalog = IAP_CATALOG[purchase.productIdentifier];
            if (catalog?.type === "non_consumable") {
              if (!entitlements.ownedProducts.includes(purchase.productIdentifier)) {
                entitlements.ownedProducts.push(purchase.productIdentifier);
                saveEntitlements(entitlements);
              }
              applyProductGrant(purchase.productIdentifier, { isNewPurchase: false });
            }
          });
        } catch (error) {
          console.warn("PurchaseService syncPurchases failed", error);
        }
      },

      getPriceLabel(productId) {
        return this.products[productId]?.priceString || "구매";

      isAvailable() {
        return Boolean(this.getPlugin()?.purchaseProduct);
      },

      async purchase(productId) {
        const plugin = this.getPlugin();
        const catalog = IAP_CATALOG[productId];
        if (!plugin?.purchaseProduct || !catalog) {
          return { ok: false, message: "결제를 사용할 수 없습니다" };
        }

        try {
          const transaction = await plugin.purchaseProduct({
            productIdentifier: productId,
            productType: "inapp",
            isConsumable: catalog.type === "consumable",
            autoAcknowledgePurchases: true
          });

          if (transaction?.purchaseState && transaction.purchaseState !== "1") {
            return { ok: false, message: "결제가 완료되지 않았습니다" };
          }

          applyProductGrant(productId, { isNewPurchase: true });
          return { ok: true };
        } catch (error) {
          return { ok: false, message: error?.message || "결제에 실패했습니다" };
        }
      },

      async restorePurchases() {
        const plugin = this.getPlugin();
        if (!plugin?.restorePurchases) {
          return { ok: false, message: "복원을 사용할 수 없습니다" };
        }

        try {
          await plugin.restorePurchases();
          await this.syncPurchases();
          syncEntitlementsFromOwnedProducts();
          return { ok: true };
        } catch (error) {
          return { ok: false, message: error?.message || "복원에 실패했습니다" };
        }
      }

    function pickRandomPowerUp(excludedEffects = []) {
      const excluded = new Set(excludedEffects);
      const entries = POWER_UPS
        .filter((powerUp) => !excluded.has(powerUp.effect))
        .map((powerUp) => ({
          powerUp,
          weight: powerUp.dropWeight ?? 1
        }));
      if (entries.length === 0) return null;
      const totalWeight = entries.reduce((sum, entry) => sum + entry.weight, 0);
      let roll = Math.random() * totalWeight;

      for (const entry of entries) {
        roll -= entry.weight;
        if (roll <= 0) {
          return entry.powerUp;
        }
      }

      return entries[entries.length - 1].powerUp;
    }

    function playBrickHitSfx(settings, intensity = 1) {
      const volume = Phaser.Math.Clamp(Number(settings?.sfxVolume) || 0, 0, 100) / 100;
      if (!volume) return;

      const context = getAudioContext();
      if (!context) return;

      const now = context.currentTime;
      const gain = context.createGain();
      const oscillator = context.createOscillator();
      const filter = context.createBiquadFilter();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(620 + intensity * 220, now);
      oscillator.frequency.exponentialRampToValueAtTime(170, now + 0.085);

      filter.type = "highpass";
      filter.frequency.setValueAtTime(180, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.09 * volume, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);

      oscillator.connect(filter);
      filter.connect(gain);
      gain.connect(context.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.12);
    }

    function playButtonSfx(settings) {

      const context = getAudioContext();

      const now = context.currentTime;

      gain.gain.exponentialRampToValueAtTime(0.075 * volume, now + 0.006);

      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.085);
    }

    const AppAudioLifecycle = {
      initialized: false,
      isActive: true,

      init() {
        if (this.initialized) return;
        this.initialized = true;

        const setActive = (active) => {
          this.isActive = active && !document.hidden;

          if (!this.isActive) {
            ScreenWakeLock.release(true);
            BgmService.pauseForLifecycle();
            if (audioContext?.state === "running") {
              audioContext.suspend().catch(() => {});
            }
            return;
          }

          if (audioContext?.state === "suspended") {
            audioContext.resume().catch(() => {});
          }
          ScreenWakeLock.request();
          BgmService.resumeFromLifecycle();
        };

        const syncVisibility = () => setActive(!document.hidden);
        document.addEventListener("visibilitychange", syncVisibility);
        window.addEventListener("pagehide", () => setActive(false));
        window.addEventListener("pageshow", syncVisibility);
        window.addEventListener("blur", () => {
          if (document.hidden) setActive(false);
        });
        window.addEventListener("focus", syncVisibility);

        const appPlugin = window.Capacitor?.Plugins?.App || window.Capacitor?.App;
        if (appPlugin?.addListener) {
          appPlugin.addListener("pause", () => setActive(false));
          appPlugin.addListener("resume", syncVisibility);
          appPlugin.addListener("appStateChange", (state) => setActive(Boolean(state?.isActive)));
        }

        syncVisibility();
      },

      canPlayAudio() {
        return this.isActive && !document.hidden;
      }
    };

    const ScreenWakeLock = {
      lock: null,
      requesting: false,
      gameplayActive: false,

      shouldKeepAwake() {
        return !document.hidden && (AppAudioLifecycle.isActive || this.gameplayActive);
      },

      async request() {
        if (this.lock || this.requesting || !navigator.wakeLock) return;
        if (!this.shouldKeepAwake()) return;

        this.requesting = true;
        try {
          this.lock = await navigator.wakeLock.request("screen");
          this.lock.addEventListener?.("release", () => {
            this.lock = null;
            if (this.shouldKeepAwake()) {
              this.request();
            }
          });
        } catch (error) {
          this.lock = null;
        } finally {
          this.requesting = false;
        }
      },

      release(force = false) {
        if (!this.lock) return;
        if (!force && this.shouldKeepAwake()) return;

        const lock = this.lock;
        this.lock = null;
        lock.release?.().catch(() => {});
      },

      setGameplayActive(active) {
        this.gameplayActive = Boolean(active);
        if (this.gameplayActive) {
          this.request();
        } else if (!AppAudioLifecycle.isActive || document.hidden) {
          this.release(true);
        }
      }
    };

    const BGM_BPM = 118;
    const BGM_PATTERN_STEPS = 64;
    const BGM_CHORDS = [
      [220.0, 261.63, 329.63, 392.0],
      [174.61, 220.0, 261.63, 329.63],
      [261.63, 329.63, 392.0, 493.88],
      [196.0, 246.94, 293.66, 369.99]
    ];
    const BGM_BASS = [110.0, 87.31, 130.81, 98.0];
    const BGM_LEAD = [440.0, 349.23, 523.25, 392.0];

    const BgmService = {
      playing: false,
      schedulerId: null,
      nextStep: 0,
      nextStepTime: 0,
      masterGain: null,
      masterFilter: null,
      lastSettings: null,
      unlockBound: false,

      getVolume(settings) {
        return Phaser.Math.Clamp(Number(settings?.bgmVolume) || 0, 0, 100) / 100;
      },

      getStepDuration() {
        return (60 / BGM_BPM) / 4;
      },

      ensureNodes() {
        const context = getAudioContext();
        if (!context) return null;

        if (!this.masterGain) {
          this.masterFilter = context.createBiquadFilter();
          this.masterFilter.type = "lowpass";
          this.masterFilter.frequency.value = 3400;
          this.masterFilter.Q.value = 0.7;

          this.masterGain = context.createGain();
          this.masterGain.gain.value = 0.0001;
          this.masterGain.connect(this.masterFilter);
          this.masterFilter.connect(context.destination);
        }

        return context;
      },

      connectToMaster(context, time, peak, attack = 0.012, release = 0.12) {
        const gain = context.createGain();
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), time + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + release);
        gain.connect(this.masterGain);
        return gain;
      },

      playTone(context, time, frequency, duration, type, peak, release = 0.16) {
        const oscillator = context.createOscillator();
        const filter = context.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(Math.min(4200, frequency * 4.5), time);

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, time);
        oscillator.connect(filter);
        filter.connect(this.connectToMaster(context, time, peak, 0.01, duration + release));
        oscillator.start(time);
        oscillator.stop(time + duration + release + 0.04);
      },

      playKick(context, time, peak) {
        const oscillator = context.createOscillator();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(128, time);
        oscillator.frequency.exponentialRampToValueAtTime(46, time + 0.09);
        oscillator.connect(this.connectToMaster(context, time, peak, 0.003, 0.16));
        oscillator.start(time);
        oscillator.stop(time + 0.18);
      },

      playSnare(context, time, peak) {
        const bufferSize = Math.floor(context.sampleRate * 0.09);
        const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i += 1) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.8);
        }

        const noise = context.createBufferSource();
        noise.buffer = buffer;
        const filter = context.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1800;
        filter.Q.value = 0.8;
        const gain = this.connectToMaster(context, time, peak, 0.002, 0.11);
        noise.connect(filter);
        filter.connect(gain);
        noise.start(time);
        noise.stop(time + 0.12);
      },

      playHiHat(context, time, peak) {
        const bufferSize = Math.floor(context.sampleRate * 0.03);
        const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i += 1) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.4);
        }

        const noise = context.createBufferSource();
        noise.buffer = buffer;
        const filter = context.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 5200;
        const gain = this.connectToMaster(context, time, peak, 0.001, 0.04);
        noise.connect(filter);
        filter.connect(gain);
        noise.start(time);
        noise.stop(time + 0.05);
      },

      scheduleStep(context, step, time) {
        const bar = Math.floor(step / 16) % 4;
        const beat = step % 16;
        const chord = BGM_CHORDS[bar];

        if (beat % 4 === 0) {
          this.playKick(context, time, 0.34);
        }

        if (beat === 4 || beat === 12) {
          this.playSnare(context, time, 0.13);
        }

        if (beat % 2 === 1) {
          this.playHiHat(context, time, beat % 4 === 3 ? 0.045 : 0.03);
        }

        if (beat % 4 === 0) {
          this.playTone(context, time, BGM_BASS[bar], 0.34, "sine", 0.2, 0.12);
        }

        if (beat % 2 === 0) {
          const arpIndex = Math.floor(beat / 2) % chord.length;
          this.playTone(context, time, chord[arpIndex], 0.11, "triangle", 0.08, 0.08);
        }

        if (beat === 0) {
          chord.forEach((frequency, index) => {
            this.playTone(context, time + index * 0.015, frequency * 0.5, 1.6, "sine", 0.035, 1.2);
          });
        }

        if (beat === 8 && bar % 2 === 1) {
          this.playTone(context, time, BGM_LEAD[bar], 0.22, "square", 0.055, 0.1);
        }
      },

      stopEngine() {
        this.playing = false;
        if (this.schedulerId) {
          clearTimeout(this.schedulerId);
          this.schedulerId = null;
        }

        if (this.masterGain) {
          this.masterGain.gain.setTargetAtTime(0.0001, getAudioContext()?.currentTime || 0, 0.04);
        }
      },

      scheduler() {
        const context = this.ensureNodes();
        if (!context || !this.playing) return;

        const volume = this.getVolume(this.lastSettings);
        const targetGain = Math.max(0.0001, volume * 0.52);
        this.masterGain.gain.setTargetAtTime(targetGain, context.currentTime, 0.04);

        const lookahead = 0.14;
        while (this.nextStepTime < context.currentTime + lookahead) {
          this.scheduleStep(context, this.nextStep % BGM_PATTERN_STEPS, this.nextStepTime);
          this.nextStep += 1;
          this.nextStepTime += this.getStepDuration();
        }

        this.schedulerId = window.setTimeout(() => this.scheduler(), 25);
      },

      start(scene, settings) {
        AppAudioLifecycle.init();
        this.lastSettings = settings;
        const volume = this.getVolume(settings);

        if (volume <= 0 || !AppAudioLifecycle.canPlayAudio()) {
          this.stopEngine();
          return;
        }

        const context = this.ensureNodes();
        if (!context) {
          this.bindUnlockRetry();
          return;
        }

        if (context.state === "suspended") {
          context.resume().then(() => this.beginPlayback(context)).catch(() => this.bindUnlockRetry());
          return;
        }

        this.beginPlayback(context);
      },

      beginPlayback(context) {
        if (!this.playing) {
          this.playing = true;
          this.nextStep = 0;
          this.nextStepTime = context.currentTime + 0.06;
          this.scheduler();
          return;
        }

        this.scheduler();
      },

      bindUnlockRetry() {
        if (this.unlockBound) return;
        this.unlockBound = true;

        const retry = () => {
          window.removeEventListener("pointerdown", retry);
          window.removeEventListener("touchstart", retry);
          window.removeEventListener("click", retry);
          this.unlockBound = false;

          if (this.getVolume(this.lastSettings) > 0 && AppAudioLifecycle.canPlayAudio()) {
            this.start(null, this.lastSettings);
          }
        };

        window.addEventListener("pointerdown", retry, { once: true });
        window.addEventListener("touchstart", retry, { once: true });
        window.addEventListener("click", retry, { once: true });
      },

      update(settings) {
        this.start(null, settings);
      },

      pauseForLifecycle() {
        this.stopEngine();
      },

      resumeFromLifecycle() {
        if (this.getVolume(this.lastSettings) > 0) {
          this.start(null, this.lastSettings);
        }
      }
    };

    function getScoreMode(mode) {
      return mode === "infinite" ? "infinite" : "stage";
    }

    function getBestScoreKey(mode) {
      return getScoreMode(mode) === "infinite" ? BEST_SCORE_INFINITE_KEY : BEST_SCORE_STAGE_KEY;
    }

    function loadBestScore(mode) {
      const scoreMode = getScoreMode(mode);

      if (scoreMode === "stage") {
        const stageV2 = localStorage.getItem(BEST_SCORE_STAGE_V2_KEY);
        if (stageV2 !== null) {
          return Math.max(0, Number(stageV2) || 0);
        }

        const legacyStage = Math.max(0, Number(localStorage.getItem(BEST_SCORE_STAGE_KEY)) || 0);
        const infinite = Math.max(0, Number(localStorage.getItem(BEST_SCORE_INFINITE_KEY)) || 0);
        return legacyStage > 0 && legacyStage !== infinite ? legacyStage : 0;
      }

      return Math.max(0, Number(localStorage.getItem(getBestScoreKey(scoreMode))) || 0);
    }

    function loadBestStats(mode = "stage") {
      try {
        const parsed = JSON.parse(localStorage.getItem(BEST_KEY) || "{}");
        const modeScore = loadBestScore(mode);
        return {
          stage: Math.max(1, Number(parsed.stage) || 1),
          score: modeScore || (getScoreMode(mode) === "stage" ? Math.max(0, Number(parsed.score) || 0) : 0)
        };
      } catch (error) {
        return { stage: 1, score: loadBestScore(mode) };
      }
    }

    function saveBestStats(stage, score, mode = "stage") {
      const best = loadBestStats(mode);
      const next = {
        stage: Math.max(best.stage, stage),
        score: Math.max(best.score, score)
      };

      localStorage.setItem(BEST_KEY, JSON.stringify(next));
      localStorage.setItem(getBestScoreKey(mode), String(next.score));
      if (getScoreMode(mode) === "stage") {
        localStorage.setItem(BEST_SCORE_STAGE_V2_KEY, String(next.score));
      }
      return next;
    }

    function loadCoins() {
      return Math.max(0, Number(localStorage.getItem(COIN_KEY)) || 0);
    }

    function saveCoins(coins) {
      const safeCoins = Math.max(0, Math.floor(Number(coins) || 0));
      localStorage.setItem(COIN_KEY, String(safeCoins));
      return safeCoins;
    }

    function getBrickCoinReward(maxHp = 1) {
      const hp = Math.max(1, Number(maxHp) || 1);
      return COIN_PER_BRICK + (hp - 1) * COIN_BONUS_PER_HP;
    }

    function loadAdCoinUsage() {
      const today = getTodayKey();
      try {
        const saved = JSON.parse(localStorage.getItem(AD_COIN_KEY) || "{}");
        if (saved.date !== today) {
          return { date: today, count: 0 };
        }
        return { date: today, count: Number(saved.count) || 0 };
      } catch (error) {
        return { date: today, count: 0 };
      }
    }

    function canWatchAdForCoins() {
      return loadAdCoinUsage().count < AD_COIN_DAILY_LIMIT;
    }

    function getAdCoinRemaining() {
      return Math.max(0, AD_COIN_DAILY_LIMIT - loadAdCoinUsage().count);
    }

    function markAdCoinWatched() {
      const usage = loadAdCoinUsage();
      usage.count += 1;
      localStorage.setItem(AD_COIN_KEY, JSON.stringify(usage));
    }

    function getMainBottomReserve() {
      return isBannerRemoved() ? MAIN_BANNER_REMOVED_RESERVE : MAIN_BANNER_RESERVE;
    }

    function getMainMenuBarY() {
      return layoutMainRankingMetrics().menuBarY;
    }

    function getMyRankingEntry(rankings, playerName, mode = "stage") {
      const scoreMode = getScoreMode(mode);
      const safeName = String(playerName || "Player").trim() || "Player";
      const normalizedName = safeName.toLowerCase();
      const found = rankings.find((item) => String(item.name).trim().toLowerCase() === normalizedName);

      if (found) {
        return { ...found, isSelf: true };
      }

      const best = loadBestStats(scoreMode);
      return {
        rank: null,
        name: safeName,
        score: best.score || loadBestScore(scoreMode),
        stage: best.stage || 1,
        isSelf: true,
        unranked: true
      };
    }

    function layoutMainRankingMetrics() {
      const bannerTop = GAME_HEIGHT - getMainBottomReserve();
      const minMenuZone = MAIN_MENU_BAR_HEIGHT + MAIN_MENU_GAP * 2;
      const availableHeight = bannerTop - MAIN_HEADER_BOTTOM - minMenuZone;
      const myRankBlock = 32;
      const headerBlock = 72;
      const listBlock = Math.max(MAIN_RANKING_VISIBLE_COUNT * 15, availableHeight - headerBlock - myRankBlock - 10);
      const rowStep = Phaser.Math.Clamp(Math.floor(listBlock / MAIN_RANKING_VISIBLE_COUNT), 15, 21);
      const listHeight = rowStep * MAIN_RANKING_VISIBLE_COUNT;
      const cardHeight = headerBlock + listHeight + myRankBlock + 10;
      const cardTop = MAIN_HEADER_BOTTOM;
      const cardBottom = cardTop + cardHeight;
      const menuBarY = (cardBottom + bannerTop) / 2;

      return {
        menuBarY,
        cardCenterY: cardTop + cardHeight / 2,
        cardHeight,
        listStartY: cardTop + headerBlock,
        rowStep,
        myRowY: cardTop + headerBlock + listHeight + 6,
        tabsY: cardTop + 24,
        titleY: cardTop + 4,
        rowFontSize: rowStep < 18 ? "12px" : "13px"
      };
    }

    function getShopTabs() {
      const tabs = [
        { id: "items", label: "코인·아이템" },
        { id: "balls", label: "공" }
      ];

      if (IAP_SHOP_ENABLED) {
        tabs.push({ id: "premium", label: "프리미엄" });
      }

      return tabs;
    }

    function getShopTabMetrics(index, total) {
      const tabBarLeft = 36;
      const tabBarWidth = GAME_WIDTH - 72;
      const tabWidth = tabBarWidth / total;
      return {
        tabBarLeft,
        tabBarWidth,
        tabBarY: SHOP_LAYOUT.tabBarY,
        tabBarHeight: SHOP_LAYOUT.tabBarHeight,
        tabWidth,
        tabCenterX: tabBarLeft + tabWidth * index + tabWidth / 2
      };
    }

    function normalizeRankings(data) {
      const rows = Array.isArray(data) ? data : (data.rankings || data.data || []);

      return rows
        .map((item, index) => ({
          rank: Number(item.rank) || index + 1,
          name: item.name || item[1] || "Player",
          score: Number(item.score ?? item[2] ?? 0) || 0,
          stage: Number(item.stage ?? item[3] ?? 1) || 1
        }))
        .sort((a, b) => b.score - a.score || b.stage - a.stage)
        .slice(0, 10)
        .map((item, index) => ({ ...item, rank: index + 1 }));
    }

    function normalizeSheetRankings(text) {
      const jsonText = text
        .replace(/^[\s\S]*?setResponse\(/, "")
        .replace(/\);?\s*$/, "");
      return normalizeSheetRankingData(JSON.parse(jsonText));
    }

    function normalizeSheetRankingData(data) {
      const rows = data.table?.rows || [];

      return rows
        .map((row) => {
          const cells = row.c || [];
          return {
            name: cells[1]?.v || cells[0]?.v || "Player",
            score: Number(cells[2]?.v ?? cells[1]?.v ?? 0) || 0
          };
        })
        .filter((item) => item.name !== "name" && Number.isFinite(item.score))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10)
        .map((item, index) => ({ ...item, rank: index + 1, stage: 1 }));
    }

    function fetchInfiniteSheetRankings() {
      return new Promise((resolve, reject) => {
        const callbackName = `handleInfiniteRanking_${Date.now()}_${Phaser.Math.Between(1000, 9999)}`;
        const script = document.createElement("script");
        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = (data) => {
          cleanup();
          resolve(normalizeSheetRankingData(data));
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("무한모드 랭킹 시트를 불러오지 못했습니다."));
        };
        script.src = `https://docs.google.com/spreadsheets/d/${INFINITE_SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&gid=${INFINITE_SHEET_GID}&ts=${Date.now()}`;
        document.body.appendChild(script);
      });
    }

    async function fetchRankings(mode = "stage") {
      const scoreMode = getScoreMode(mode);

      if (scoreMode === "infinite") {
        const rankings = await fetchInfiniteSheetRankings();

        if (rankings.length === 0 && loadBestScore("infinite") > 0) {
          return [{
            rank: 1,
            name: `${loadPlayerName()} (내 기록)`,
            score: loadBestScore("infinite"),
            stage: 1
          }];
        }

        return rankings;
      }

      const response = await fetch(`${SCORE_API_URL}?mode=${encodeURIComponent(scoreMode)}&limit=10&ts=${Date.now()}`);

      if (!response.ok) {
        throw new Error(`랭킹 서버 오류: ${response.status}`);
      }

      return normalizeRankings(await response.json());
    }

    function notifyAisleParent(mode, score) {
      try {
        if (!window.parent || window.parent === window) return;
        const safeScore = Math.max(0, Math.floor(Number(score) || 0));
        window.parent.postMessage(
          { type: "aisle-game-score", mode: getScoreMode(mode), score: safeScore },
          window.location.origin
        );
      } catch (error) {
        // parent may be cross-origin (standalone); ignore
      }
    }

    function postScore(name, score, stage, mode = "stage") {
      const scoreMode = getScoreMode(mode);
      const payload = {
        name,
        score: Math.floor(score),
        mode: scoreMode
      };

      if (scoreMode === "infinite") {
        payload.sheetUrl = INFINITE_SHEET_URL;
        payload.sheetId = INFINITE_SHEET_ID;
        payload.gid = INFINITE_SHEET_GID;
      }

      notifyAisleParent(scoreMode, payload.score);

      return fetch(SCORE_API_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        body: JSON.stringify(payload)
      });
    }

    const AdService = {
      initialized: false,
      interstitialReady: false,
      rewardedReady: false,
      bannerVisible: false,
      bannerHidden: false,

      getPlugin() {
        return window.Capacitor?.Plugins?.AdMob || window.AdMob || null;
      },

      async initialize() {
        const AdMob = this.getPlugin();

        if (!AdMob || this.initialized) {
          return false;
        }

        try {
          if (AdMob.initialize) {
            await AdMob.initialize({
              requestTrackingAuthorization: false,
              initializeForTesting: ADMOB_IS_TESTING
            });
          }

          this.initialized = true;
          await Promise.allSettled([
            this.prepareInterstitial(),
            this.prepareRewarded()
          ]);
          return true;
        } catch (error) {
          console.warn("AdMob initialize failed", error);
          return false;
        }
      },

      async prepareInterstitial() {
        const AdMob = this.getPlugin();
        if (!AdMob?.prepareInterstitial) return false;

        try {
          await AdMob.prepareInterstitial({
            adId: ADMOB_INTERSTITIAL_ID,
            isTesting: ADMOB_IS_TESTING
          });
          this.interstitialReady = true;
          return true;
        } catch (error) {
          this.interstitialReady = false;
          return false;
        }
      },

      async showInterstitial() {
        const AdMob = this.getPlugin();
        if (!AdMob?.showInterstitial) return false;

        try {
          if (!this.initialized) await this.initialize();
          if (!this.interstitialReady) await this.prepareInterstitial();
          await AdMob.showInterstitial();
          this.interstitialReady = false;
          this.prepareInterstitial();
          return true;
        } catch (error) {
          this.interstitialReady = false;
          this.prepareInterstitial();
          return false;
        }
      },

      async prepareRewarded() {
        const AdMob = this.getPlugin();
        const prepare = AdMob?.prepareRewardVideoAd || AdMob?.prepareRewardedAd;
        if (!prepare) return false;

        try {
          await prepare.call(AdMob, {
            adId: ADMOB_REWARDED_ID,
            isTesting: ADMOB_IS_TESTING
          });
          this.rewardedReady = true;
          return true;
        } catch (error) {
          this.rewardedReady = false;
          return false;
        }
      },

      async showRewarded() {
        const AdMob = this.getPlugin();
        const show = AdMob?.showRewardVideoAd || AdMob?.showRewardedAd;
        if (!show) return false;

        try {
          if (!this.initialized) await this.initialize();
          if (!this.rewardedReady) await this.prepareRewarded();

          let rewarded = false;
          const listeners = [];
          const eventNames = ["onRewardedVideoAdReward", "onRewarded", "rewarded", "Rewarded", "rewardVideoRewarded"];

          if (AdMob.addListener) {
            for (const eventName of eventNames) {
              try {
                const handle = await Promise.resolve(AdMob.addListener(eventName, () => {
                  rewarded = true;
                }));
                listeners.push(handle);
              } catch (error) {
                // 플러그인 버전에 따라 지원하지 않는 이벤트명이 있을 수 있다.
              }
            }
          }

          const rewardItem = await show.call(AdMob);
          if (rewardItem && (rewardItem.amount !== undefined || rewardItem.type !== undefined)) {
            rewarded = true;
          }
          await new Promise((resolve) => setTimeout(resolve, 500));
          listeners.forEach((handle) => handle?.remove?.());
          this.rewardedReady = false;
          this.prepareRewarded();

          return rewarded;
        } catch (error) {
          this.rewardedReady = false;
          this.prepareRewarded();
          return false;
        }
      },

      async showBanner() {
        if (isBannerRemoved()) return false;

        const AdMob = this.getPlugin();
        if (!AdMob?.showBanner) return false;

        try {
          if (!this.initialized) await this.initialize();
          if (this.bannerVisible) return true;

          if (this.bannerHidden && AdMob.resumeBanner) {
            await AdMob.resumeBanner();
            this.bannerHidden = false;
            this.bannerVisible = true;
            return true;
          }

          await AdMob.showBanner({
            adId: ADMOB_BANNER_ID,
            adSize: "ADAPTIVE_BANNER",
            position: "BOTTOM_CENTER",
            margin: 0,
            isTesting: ADMOB_IS_TESTING
          });
          this.bannerHidden = false;
          this.bannerVisible = true;
          return true;
        } catch (error) {
          console.warn("AdMob showBanner failed", error);
          this.bannerVisible = false;
          this.bannerHidden = false;
          return false;
        }
      },

      async hideBanner() {
        const AdMob = this.getPlugin();
        if (!AdMob?.hideBanner) return false;
        if (!this.bannerVisible && !this.bannerHidden) return false;

        try {
          if (this.bannerVisible) {
            await AdMob.hideBanner();
          }
          this.bannerVisible = false;
          this.bannerHidden = true;
          return true;
        } catch (error) {
          this.bannerVisible = false;
          this.bannerHidden = false;
          return false;
        }
      },

      async removeBanner() {
        const AdMob = this.getPlugin();
        if (!AdMob?.removeBanner) {
          return this.hideBanner();
        }
        if (!this.bannerVisible && !this.bannerHidden) return false;

        try {
          await AdMob.removeBanner();
          this.bannerVisible = false;
          this.bannerHidden = false;
          return true;
        } catch (error) {
          this.bannerVisible = false;
          this.bannerHidden = false;
          return false;
        }
      }
    };

    class BaseScene extends Phaser.Scene {
      drawAppBackground(paletteIndex = 0) {
        const palette = BACKGROUND_PALETTES[paletteIndex % BACKGROUND_PALETTES.length];

        this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, palette.base).setOrigin(0);

        const glow = this.add.graphics();
        glow.fillGradientStyle(palette.glowA, palette.glowB, palette.glowC, palette.base, 0.46, 0.26, 0.04, 0);
        glow.fillCircle(GAME_WIDTH / 2, 104, 290);

        const panel = this.add.graphics();
        panel.lineStyle(1, 0xffffff, 0.1);
        panel.fillStyle(0xffffff, 0.038);
        panel.fillRoundedRect(18, 18, GAME_WIDTH - 36, GAME_HEIGHT - 58, 30);
        panel.strokeRoundedRect(18, 18, GAME_WIDTH - 36, GAME_HEIGHT - 58, 30);
      }

      addButton(x, y, width, height, label, onClick, options = {}) {
        const container = this.add.container(x, y).setDepth(options.depth || 10);
        const bg = this.add.graphics();
        const fill = options.fill ?? 0xffffff;
        const alpha = options.alpha ?? 0.1;

        bg.fillStyle(fill, alpha);
        bg.lineStyle(1, options.stroke ?? 0xffffff, options.strokeAlpha ?? 0.16);
        bg.fillRoundedRect(-width / 2, -height / 2, width, height, 20);
        bg.strokeRoundedRect(-width / 2, -height / 2, width, height, 20);

        const text = this.add.text(0, 0, label, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: options.fontSize || "18px",
          fontStyle: "800",
          color: options.color || "#ffffff"
        }).setOrigin(0.5);

        const invoke = () => {
          const now = this.time?.now ?? performance.now();
          const lastInvokeAt = container.getData("lastInvokeAt") || 0;
          if (now - lastInvokeAt < 300) return;
          container.setData("lastInvokeAt", now);
          playButtonSfx(this.settings || loadSettings());
          onClick();
        };

        container.add([bg, text]);
        container.setSize(width, height);
        container.setInteractive(new Phaser.Geom.Rectangle(-width / 2, -height / 2, width, height), Phaser.Geom.Rectangle.Contains);
        container.on("pointerdown", invoke);
        this.bindNativeButtonTouch(container, width, height, invoke);
        container.on("pointerover", () => {
          this.tweens.killTweensOf(container);
          this.tweens.add({
            targets: container,
            scale: 1.1,
            duration: 120,
            ease: "Back.easeOut"
          });
        });
        container.on("pointerout", () => {
          this.tweens.killTweensOf(container);
          this.tweens.add({
            targets: container,
            scale: 1,
            duration: 100,
            ease: "Sine.easeOut"
          });
        });
        return container;
      }

      bindNativeButtonTouch(container, width, height, onClick, options = {}) {
        const canvas = this.game.canvas;
        const buttonDepth = options.depth ?? 10;
        const handler = (event) => {
          if (!container.active || !container.visible) return;
          if (typeof this.isUiModalOpen === "function" && this.isUiModalOpen() && buttonDepth < 50) return;

          const touch = event.touches?.[0] || event.changedTouches?.[0] || event;
          if (!touch || !Number.isFinite(touch.clientX) || !Number.isFinite(touch.clientY)) return;

          const rect = canvas.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;

          const gameX = ((touch.clientX - rect.left) / rect.width) * GAME_WIDTH;
          const gameY = ((touch.clientY - rect.top) / rect.height) * GAME_HEIGHT;
          const bounds = container.getBounds();
          const isInside = gameX >= bounds.left && gameX <= bounds.right && gameY >= bounds.top && gameY <= bounds.bottom;

          if (!isInside) return;

          event.preventDefault?.();
          onClick();
        };

        canvas.addEventListener("touchstart", handler, { passive: false });
        canvas.addEventListener("pointerdown", handler, { passive: false });

        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
          canvas.removeEventListener("touchstart", handler);
          canvas.removeEventListener("pointerdown", handler);
        });
      }

      addCard(x, y, width, height, depth = 20) {
        const card = this.add.graphics().setDepth(depth);
        card.fillStyle(0x11182b, 0.94);
        card.lineStyle(1, 0xffffff, 0.13);
        card.fillRoundedRect(x - width / 2, y - height / 2, width, height, 28);
        card.strokeRoundedRect(x - width / 2, y - height / 2, width, height, 28);
        return card;
      }

      drawBrickModalCard(graphics, x, y, width, height) {
        graphics.fillStyle(0x000000, 0.24);
        graphics.fillRoundedRect(x + 3, y + 5, width, height, 24);
        graphics.fillStyle(0x0d1424, 0.97);
        graphics.fillRoundedRect(x, y, width, height, 24);
        graphics.lineStyle(2, 0x72f6ff, 0.24);
        graphics.strokeRoundedRect(x, y, width, height, 24);

        const accentColors = [0xa879ff, 0x72f6ff, 0x5cff9d, 0xffcf5a, 0xff4d8d];
        const accentWidth = (width - 28) / accentColors.length;
        accentColors.forEach((color, index) => {
          graphics.fillStyle(color, 0.82);
          graphics.fillRoundedRect(x + 14 + index * accentWidth, y + 10, accentWidth - 4, 7, 3);
        });
      }

      addBrickButton(x, y, width, height, label, onClick, options = {}) {
        const textureKey = options.brickTexture || "element_blue_rectangle";
        const glowColor = BRICK_PARTICLE_COLORS[textureKey] || 0x72f6ff;
        const buttonDepth = options.depth ?? 10;
        const container = this.add.container(x, y).setDepth(buttonDepth);
        const halfW = width / 2;
        const halfH = height / 2;
        const radius = Math.min(12, height / 2 - 1);

        const shadow = this.add.graphics();
        shadow.fillStyle(0x000000, 0.34);
        shadow.fillRoundedRect(-halfW + 2, -halfH + 3, width, height, radius);

        const brick = this.add.image(0, 0, textureKey).setDisplaySize(width, height);
        if (options.dimmed) {
          brick.setAlpha(0.72);
        }

        const gloss = this.add.graphics();
        gloss.fillStyle(0xffffff, options.dimmed ? 0.14 : 0.24);
        gloss.fillRoundedRect(-halfW + 5, -halfH + 3, width - 10, Math.max(8, height * 0.42), Math.max(4, radius - 2));
        gloss.fillStyle(0xffffff, 0.07);
        gloss.fillRoundedRect(-halfW + 4, halfH - 7, width - 8, 4, 2);

        const edge = this.add.graphics();
        edge.lineStyle(2, 0x000000, 0.22);
        edge.strokeRoundedRect(-halfW, -halfH, width, height, radius);
        edge.lineStyle(1, glowColor, options.dimmed ? 0.34 : 0.62);
        edge.strokeRoundedRect(-halfW + 1, -halfH + 1, width - 2, height - 2, Math.max(3, radius - 1));

        const text = this.add.text(0, 1, label, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: options.fontSize || "18px",
          fontStyle: "900",
          color: options.color || "#ffffff",
          stroke: "#081018",
          strokeThickness: options.strokeThickness ?? 3
        }).setOrigin(0.5);

        const invoke = () => {
          const now = this.time?.now ?? performance.now();
          const lastInvokeAt = container.getData("lastInvokeAt") || 0;
          if (now - lastInvokeAt < 300) return;
          if (buttonDepth >= 66 && typeof this.isShopInputLocked === "function" && this.isShopInputLocked()) return;
          if (typeof this.isUiModalOpen === "function" && this.isUiModalOpen() && buttonDepth < 50) return;
          container.setData("lastInvokeAt", now);
          playButtonSfx(this.settings || loadSettings());
          onClick();
        };

        container.add([shadow, brick, gloss, edge, text]);
        container.setSize(width, height);
        container.setInteractive(new Phaser.Geom.Rectangle(-halfW, -halfH, width, height), Phaser.Geom.Rectangle.Contains);
        container.on("pointerdown", invoke);
        this.bindNativeButtonTouch(container, width, height, invoke, { depth: buttonDepth });
        container.on("pointerover", () => {
          this.tweens.killTweensOf(container);
          this.tweens.add({
            targets: container,
            scale: 1.06,
            duration: 120,
            ease: "Back.easeOut"
          });
        });
        container.on("pointerout", () => {
          this.tweens.killTweensOf(container);
          this.tweens.add({
            targets: container,
            scale: 1,
            duration: 100,
            ease: "Sine.easeOut"
          });
        });
        return container;
      }
    }

        const mission = loadDailyMission();
        if (mission.claimed) return `일일 미션 완료 · +${DAILY_MISSION_REWARD} 코인`;
        return `일일 미션 ${Math.min(mission.bricks, DAILY_MISSION_GOAL)}/${DAILY_MISSION_GOAL}`;

        if (this.missionText) {

        const mission = loadDailyMission();
        if (mission.claimed || mission.bricks < DAILY_MISSION_GOAL) {
          return false;

        mission.claimed = true;
        saveDailyMission(mission);
        this.coins = saveCoins(this.coins + DAILY_MISSION_REWARD);

        this.refreshMissionDisplay();
        return true;

          duration: 500,
          ease: "Sine.easeIn"
        });

        const resolvedStartStage = mode === "normal"
          ? Phaser.Math.Clamp(Math.floor(Number(startStage) || 1), 1, getMaxUnlockedStage())
          : 1;

        this.gameTransitionTimer = window.setTimeout(() => {

            playerName: this.playerName,
            settings: this.settings,
            mode,
            startStage: resolvedStartStage,
            paddleItemId: getPaddleItemForRun()

          }
        );

        this.stageSelectModal.add([
          overlay,
          card,
          badge,
          title,
          note,
          this.stageSelectMask,
          this.stageSelectListContainer,
          this.stageSelectCloseButton
        ]);

        this.bindStageSelectScrollInput();
      }

      updateStageSelectMask() {
        if (!this.stageSelectMask) return;
        const top = STAGE_SELECT_LAYOUT.listTop;
        const height = getStageSelectListViewportHeight();
        this.stageSelectMask.clear();
        this.stageSelectMask.fillStyle(0xffffff);
        this.stageSelectMask.fillRect(24, top, GAME_WIDTH - 48, height);
      }

      buildStageSelectButtons(maxStage) {
        if (!this.stageSelectListContainer) return;

        this.stageSelectListContainer.removeAll(true);
        const stageNumbers = [];
        for (let stage = maxStage; stage >= 1; stage -= 1) {
          stageNumbers.push(stage);
        }

        const cols = 2;
        const listLeft = 36;
        const listWidth = GAME_WIDTH - 72;
        const buttonWidth = (listWidth - STAGE_SELECT_LAYOUT.colGap) / cols;
        const buttonHeight = STAGE_SELECT_LAYOUT.buttonHeight;
        const rowStep = STAGE_SELECT_LAYOUT.rowStep;

        stageNumbers.forEach((stageNum, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          const x = listLeft + col * (buttonWidth + STAGE_SELECT_LAYOUT.colGap) + buttonWidth / 2;
          const y = buttonHeight / 2 + row * rowStep;
          const isLatest = stageNum === maxStage;
          const rowItems = [];

          const bg = this.add.graphics();
          bg.fillStyle(isLatest ? 0xffcf5a : 0xffffff, isLatest ? 0.12 : 0.05);
          bg.lineStyle(isLatest ? 2 : 1, isLatest ? 0xffcf5a : 0x72f6ff, isLatest ? 0.72 : 0.22);
          bg.fillRoundedRect(x - buttonWidth / 2, y - buttonHeight / 2, buttonWidth, buttonHeight, 14);
          bg.strokeRoundedRect(x - buttonWidth / 2, y - buttonHeight / 2, buttonWidth, buttonHeight, 14);
          rowItems.push(bg);

          const stageLabel = this.add.text(x, y - 12, `STAGE ${stageNum}`, {
            fontFamily: "Inter, Arial, sans-serif",
            fontSize: "14px",
            fontStyle: "900",
            color: isLatest ? "#ffcf5a" : "#ffffff"
          }).setOrigin(0.5);
          rowItems.push(stageLabel);

          const detail = this.add.text(x, y + 10, getStageSelectSummary(stageNum), {
            fontFamily: "Inter, Arial, sans-serif",
            fontSize: "9px",
            color: "#aebbf0",
            align: "center"
          }).setOrigin(0.5);
          rowItems.push(detail);

          const hitZone = this.add.rectangle(x, y, buttonWidth, buttonHeight, 0xffffff, 0)
            .setInteractive({ useHandCursor: true });
          hitZone.on("pointerdown", () => this.startNormalGame(stageNum));
          rowItems.push(hitZone);

          this.stageSelectListContainer.add(rowItems);
        });

        const rowCount = Math.ceil(stageNumbers.length / cols);
        const contentHeight = rowCount > 0 ? (rowCount - 1) * rowStep + buttonHeight : 0;
        this.stageSelectMaxScroll = Math.max(0, contentHeight - getStageSelectListViewportHeight());
        this.setStageSelectScroll(this.stageSelectScroll || 0);
      }

      setStageSelectScroll(offset) {
        if (!this.stageSelectListContainer) return;
        this.stageSelectScroll = Phaser.Math.Clamp(offset, 0, this.stageSelectMaxScroll || 0);
        this.stageSelectListContainer.setY(STAGE_SELECT_LAYOUT.listTop - this.stageSelectScroll);
      }

      bindStageSelectScrollInput() {
        if (this.stageSelectScrollBound) return;
        this.stageSelectScrollBound = true;
        this.stageSelectDragging = false;

        this.stageSelectPointerDown = (pointer) => {
          if (!this.stageSelectModal?.active || (this.stageSelectMaxScroll || 0) <= 0) return;
          const top = STAGE_SELECT_LAYOUT.listTop;
          const bottom = top + getStageSelectListViewportHeight();
          if (pointer.y < top || pointer.y > bottom) return;
          const hits = this.input.hitTestPointer(pointer);
          const onStageButton = hits.some((obj) => obj.input?.enabled);
          if (onStageButton) return;
          this.stageSelectDragging = true;
          this.stageSelectDragStartY = pointer.y;
          this.stageSelectDragStartScroll = this.stageSelectScroll || 0;
        };

        this.stageSelectPointerMove = (pointer) => {
          if (!this.stageSelectDragging || !pointer.isDown) return;
          this.setStageSelectScroll(this.stageSelectDragStartScroll + (this.stageSelectDragStartY - pointer.y));
        };

        this.stageSelectPointerUp = () => {
          this.stageSelectDragging = false;
        };

        this.stageSelectWheelHandler = (pointer, _currentlyOver, _deltaX, deltaY) => {
          if (!this.stageSelectModal?.active || (this.stageSelectMaxScroll || 0) <= 0) return;
          const top = STAGE_SELECT_LAYOUT.listTop;
          const bottom = top + getStageSelectListViewportHeight();
          if (pointer.y < top || pointer.y > bottom) return;
          this.setStageSelectScroll((this.stageSelectScroll || 0) + deltaY * 0.35);
        };

        this.input.on("pointerdown", this.stageSelectPointerDown);
        this.input.on("pointermove", this.stageSelectPointerMove);
        this.input.on("pointerup", this.stageSelectPointerUp);
        this.input.on("pointerupoutside", this.stageSelectPointerUp);
        this.input.on("wheel", this.stageSelectWheelHandler);
      }

      startNormalGame(stageNum) {
        if (this.transitioningToGame) return;
        this.closeStageSelectModal(false);
        this.transitionToGame("normal", stageNum);
      }

      closeStageSelectModal(showBanner = true) {
        if (this.stageSelectWheelHandler) {
          this.input.off("wheel", this.stageSelectWheelHandler);
          this.stageSelectWheelHandler = null;
        }
        if (this.stageSelectPointerDown) {
          this.input.off("pointerdown", this.stageSelectPointerDown);
          this.stageSelectPointerDown = null;
        }
        if (this.stageSelectPointerMove) {
          this.input.off("pointermove", this.stageSelectPointerMove);
          this.stageSelectPointerMove = null;
        }
        if (this.stageSelectPointerUp) {
          this.input.off("pointerup", this.stageSelectPointerUp);
          this.input.off("pointerupoutside", this.stageSelectPointerUp);
          this.stageSelectPointerUp = null;
        }
        this.stageSelectScrollBound = false;

        if (this.stageSelectModal) {
          this.stageSelectModal.destroy();
          this.stageSelectModal = null;
          this.stageSelectListContainer = null;
          this.stageSelectMask = null;
          this.stageSelectMaskObject = null;
          this.stageSelectCloseButton = null;
          this.stageSelectScroll = 0;
          this.stageSelectMaxScroll = 0;
        }

        if (showBanner && this.scene.isActive()) {
          AdService.showBanner();
        }
      }

      createRankingPreview() {
        this.applyMainLayoutMetrics();

        this.addBrickCard(GAME_WIDTH / 2, this.rankingCardCenterY, 318, this.rankingCardHeight, 5);
        this.add.text(GAME_WIDTH / 2, this.rankingTitleY, "TOP 10 RANKING", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "14px",
          fontStyle: "900",
          color: "#ffffff",
          stroke: "#081018",
          strokeThickness: 2
        }).setOrigin(0.5, 0).setDepth(6);
        this.previewRankingTabs = this.createRankingTabs(this.rankingTabsY, 6, (mode) => {
          this.rankingMode = mode;
          this.refreshRankings(false);
        });

        this.rankingStatus = this.add.text(
          GAME_WIDTH / 2,
          this.rankingListStartY + (MAIN_RANKING_VISIBLE_COUNT * this.rankingRowStep) / 2,
          "로딩 중...",
          {
            fontFamily: "Inter, Arial, sans-serif",
            fontSize: "14px",
            color: "#d8e4ff",
            align: "center"
          }
        ).setOrigin(0.5).setDepth(6);

        this.rankingItems = [];
      }

      refreshCoinDisplay() {
        this.coins = loadCoins();
        if (this.coinText) {
          this.coinText.setText(`코인 ${this.coins}`);
        }
        if (this.shopCoinText) {
          this.shopCoinText.setText(`보유 코인 ${this.coins}`);
        }
      }

      renderShopTabs() {
        if (!this.shopModal) return;

        if (this.shopTabBar) {
          this.shopTabBar.destroy();
          this.shopTabBar = null;
        }

        if (this.shopTabButtons) {
          this.shopTabButtons.forEach((tab) => tab.hitZone?.destroy());
        }

        this.shopTabButtons = [];
        const tabs = getShopTabs();
        if (!tabs.some((tab) => tab.id === this.shopTab)) {
          this.shopTab = tabs[0].id;
        }

        const metrics = getShopTabMetrics(0, tabs.length);
        this.shopTabBar = this.add.container(0, 0).setDepth(66);

        const tabBg = this.add.graphics();
        tabBg.fillStyle(0x081018, 0.72);
        tabBg.fillRoundedRect(metrics.tabBarLeft, metrics.tabBarY, metrics.tabBarWidth, metrics.tabBarHeight, 14);
        tabBg.lineStyle(1, 0x72f6ff, 0.18);
        tabBg.strokeRoundedRect(metrics.tabBarLeft, metrics.tabBarY, metrics.tabBarWidth, metrics.tabBarHeight, 14);
        this.shopTabBar.add(tabBg);

        tabs.forEach((tab, index) => {
          const tabMetrics = getShopTabMetrics(index, tabs.length);
          const isActive = this.shopTab === tab.id;
          const segmentLeft = tabMetrics.tabBarLeft + tabMetrics.tabWidth * index + 4;
          const segmentWidth = tabMetrics.tabWidth - 8;

          if (isActive) {
            const activeBg = this.add.graphics();
            activeBg.fillStyle(0x72f6ff, 0.16);
            activeBg.fillRoundedRect(segmentLeft, metrics.tabBarY + 5, segmentWidth, metrics.tabBarHeight - 10, 10);
            activeBg.lineStyle(1, 0x72f6ff, 0.55);
            activeBg.strokeRoundedRect(segmentLeft, metrics.tabBarY + 5, segmentWidth, metrics.tabBarHeight - 10, 10);
            this.shopTabBar.add(activeBg);

            const indicator = this.add.graphics();
            indicator.fillStyle(0xffcf5a, 1);
            indicator.fillRoundedRect(segmentLeft + 12, metrics.tabBarY + metrics.tabBarHeight - 7, segmentWidth - 24, 3, 2);
            this.shopTabBar.add(indicator);
          }

          const label = this.add.text(tabMetrics.tabCenterX, metrics.tabBarY + 14, tab.label, {
            fontFamily: "Inter, Arial, sans-serif",
            fontSize: isActive ? "13px" : "12px",
            fontStyle: "900",
            color: isActive ? "#ffffff" : "#8ea2d8",
            stroke: isActive ? "#081018" : undefined,
            strokeThickness: isActive ? 2 : 0
          }).setOrigin(0.5, 0);
          this.shopTabBar.add(label);

          const hitZone = this.add.rectangle(
            tabMetrics.tabCenterX,
            metrics.tabBarY + metrics.tabBarHeight / 2,
            segmentWidth,
            metrics.tabBarHeight - 6,
            0xffffff,
            0
          ).setInteractive({ useHandCursor: true });
          hitZone.on("pointerdown", () => {
            if (this.shopTab === tab.id) return;
            this.shopTab = tab.id;
            this.buildShopItems();
          });
          this.shopTabBar.add(hitZone);
          this.shopTabButtons.push({ id: tab.id, hitZone });
        });

        this.shopModal.add(this.shopTabBar);
      }

      syncShopModalLayers() {
        if (!this.shopModal) return;
        if (this.shopTabBar?.active) {
          this.shopModal.bringToTop(this.shopTabBar);
        }
        if (this.shopCloseButton?.active) {
          this.shopModal.bringToTop(this.shopCloseButton);
        }
      }

      positionShopCloseButton() {
        const closeY = getShopCloseButtonY();
        if (this.shopCloseButton) {
          this.shopCloseButton.setPosition(GAME_WIDTH / 2, closeY);
        }
        return closeY;
      }

      updateShopListMask() {
        if (!this.shopListMask) return;
        const top = getShopListViewportTop();
        const height = getShopListViewportHeight();
        this.shopListMask.clear();
        this.shopListMask.fillStyle(0xffffff);
        this.shopListMask.fillRect(24, top, GAME_WIDTH - 48, height);
      }

      setShopListScroll(offset) {
        if (!this.shopItemsContainer) return;
        const maxScroll = this.shopListMaxScroll || 0;
        this.shopListScroll = Phaser.Math.Clamp(offset, 0, maxScroll);
        this.shopItemsContainer.setY(getShopListViewportTop() - this.shopListScroll);
      }

      setupShopListScroll(rowCount, rowStep, rowHeight) {
        this.positionShopCloseButton();
        if (!this.shopItemsContainer) return;

        const viewportHeight = getShopListViewportHeight();
        const contentHeight = getShopListContentHeight(rowCount, rowStep, rowHeight);
        this.shopListMaxScroll = Math.max(0, contentHeight - viewportHeight);
        this.setShopListScroll(this.shopListScroll || 0);
      }

      isShopListPointerBlocked(pointer) {
        const hits = this.input.hitTestPointer(pointer);
        return hits.some((obj) => {
          let current = obj;
          while (current) {
            if (current.getData?.("shopRowAction")) return true;
            current = current.parentContainer;
          }
          return false;
        });
      }

      bindShopListScrollInput() {
        if (this.shopListScrollBound) return;
        this.shopListScrollBound = true;
        this.shopListDragStartY = 0;
        this.shopListDragStartScroll = 0;
        this.shopListDragging = false;

        this.shopListPointerDown = (pointer) => {
          if (!this.shopModal?.active || (this.shopListMaxScroll || 0) <= 0) return;
          const top = getShopListViewportTop();
          const bottom = top + getShopListViewportHeight();
          if (pointer.y < top || pointer.y > bottom) return;
          if (this.isShopListPointerBlocked(pointer)) return;
          this.shopListDragging = true;
          this.shopListDragStartY = pointer.y;
          this.shopListDragStartScroll = this.shopListScroll || 0;
        };

        this.shopListPointerMove = (pointer) => {
          if (!this.shopListDragging || !pointer.isDown) return;
          this.setShopListScroll(this.shopListDragStartScroll + (this.shopListDragStartY - pointer.y));
        };

        this.shopListPointerUp = () => {
          this.shopListDragging = false;
        };

        this.shopWheelHandler = (pointer, _currentlyOver, _deltaX, deltaY) => {
          if (!this.shopModal?.active || (this.shopListMaxScroll || 0) <= 0) return;
          const top = getShopListViewportTop();
          const bottom = top + getShopListViewportHeight();
          if (pointer.y < top || pointer.y > bottom) return;
          this.setShopListScroll((this.shopListScroll || 0) + deltaY * 0.35);
        };

        this.input.on("pointerdown", this.shopListPointerDown);
        this.input.on("pointermove", this.shopListPointerMove);
        this.input.on("pointerup", this.shopListPointerUp);
        this.input.on("pointerupoutside", this.shopListPointerUp);
        this.input.on("wheel", this.shopWheelHandler);
      }

      showShopToast(message, x = GAME_WIDTH / 2, y = getShopCloseButtonY() - 56) {
        const toast = this.add.text(x, y, message, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "13px",
          fontStyle: "800",
          color: "#ffffff",
          stroke: "#081018",
          strokeThickness: 2,
          align: "center"
        }).setOrigin(0.5).setDepth(72);

        this.tweens.add({
          targets: toast,
          alpha: 0,
          y: y - 18,
          duration: 900,
          delay: 700,
          onComplete: () => toast.destroy()
        });
      }

      showShopModal() {
        if (this.shopModal?.active) return;
        if (this.shopModal && !this.shopModal.active) {
          this.shopModal = null;
        }

        AdService.removeBanner();
        ensureShopIconTextures(this);
        this.shopState = loadShopState();
        this.shopTab = getShopTabs()[0].id;
        this.refreshCoinDisplay();

        this.shopModal = this.add.container(0, 0).setDepth(65);
        const overlay = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x03050d, 0.76);
        overlay.setInteractive();
        overlay.on("pointerdown", (pointer) => {
          pointer.event?.stopPropagation?.();
        });
        const card = this.add.graphics();
        this.drawBrickModalCard(card, 24, SHOP_LAYOUT.cardTop, GAME_WIDTH - 48, SHOP_LAYOUT.cardHeight);

        const title = this.add.text(GAME_WIDTH / 2, SHOP_LAYOUT.titleY, "SHOP", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "24px",
          fontStyle: "900",
          color: "#ffffff",
          stroke: "#081018",
          strokeThickness: 2
        }).setOrigin(0.5);

        this.shopCoinText = this.add.text(GAME_WIDTH / 2, SHOP_LAYOUT.coinY, `보유 코인 ${this.coins}`, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "14px",
          fontStyle: "900",
          color: "#ffcf5a"
        }).setOrigin(0.5);

        this.shopNoteText = this.add.text(GAME_WIDTH / 2, SHOP_LAYOUT.noteY, "플레이·광고로 코인을 모아 아이템 구매 · 장착한 공은 모든 모드에 적용", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "10px",
          color: "#aebbf0",
          align: "center",
          wordWrap: { width: 300 }
        }).setOrigin(0.5);

        this.shopTabButtons = [];
        this.shopListScroll = 0;
        this.shopListMaxScroll = 0;
        this.shopListScrollBound = false;
        this.shopInputLockedUntil = 0;
        this.shopItemsRebuildTimer = null;
        this.shopListMask = this.add.graphics();
        this.shopListMaskObject = this.shopListMask.createGeometryMask();
        this.shopListMask.setVisible(false);
        this.updateShopListMask();

        const listViewportTop = getShopListViewportTop();
        this.shopItemsContainer = this.add.container(0, listViewportTop);
        this.shopItemsContainer.setMask(this.shopListMaskObject);

        this.shopCloseButton = this.addBrickButton(
          GAME_WIDTH / 2,
          getShopCloseButtonY(),
          220,
          SHOP_LAYOUT.closeButtonHeight,
          "닫기",
          () => this.closeShopModal(),
          {
            depth: 66,
            brickTexture: "element_grey_rectangle",
            dimmed: true,
            fontSize: "15px"
          }
        );

        this.shopModal.add([
          overlay,
          card,
          title,
          this.shopCoinText,
          this.shopNoteText,
          this.shopListMask,
          this.shopItemsContainer,
          this.shopCloseButton
        ]);
        this.bindShopListScrollInput();
        this.buildShopItems();
      }

      updateShopTabs() {
        this.renderShopTabs();
      }

      buildShopItems() {
        if (!this.shopItemsContainer) return;
        this.shopItemsContainer.removeAll(true);
        this.shopListScroll = 0;
        this.updateShopTabs();

        if (IAP_SHOP_ENABLED && this.shopTab === "premium") {
          this.buildPremiumShopItems();
          this.syncShopModalLayers();
          return;
        }

        if (this.shopTab === "items") {
          this.buildItemShopRows();
          this.syncShopModalLayers();
          return;
        }

        this.buildBallShopRows();
        this.syncShopModalLayers();
      }

      lockShopInput(durationMs = 400) {
        const now = this.time?.now ?? performance.now();
        this.shopInputLockedUntil = Math.max(this.shopInputLockedUntil || 0, now + durationMs);
      }

      isShopInputLocked() {
        const now = this.time?.now ?? performance.now();
        return now < (this.shopInputLockedUntil || 0);
      }

      scheduleShopItemsRebuild() {
        if (this.shopItemsRebuildTimer) {
          this.shopItemsRebuildTimer.remove(false);
        }

        this.shopItemsRebuildTimer = this.time.delayedCall(50, () => {
          this.shopItemsRebuildTimer = null;
          this.buildShopItems();
        });
      }

      buildBallShopRows() {
        this.shopState = loadShopState();
        const ballIds = ["default", "blaze", "thunder", "pierce"];
        ballIds.forEach((ballId, index) => {
          const config = getShopBallConfig(ballId);
          const level = this.shopState.levels[ballId] || 0;
          const unlocked = Boolean(this.shopState.unlocked[ballId]);
          const equipped = this.shopState.equipped === ballId;
          const y = getShopRowY(index, SHOP_LAYOUT.ballRowStep, SHOP_LAYOUT.ballRowHeight);
          const rowOptions = {
            y,
            rowHeight: SHOP_LAYOUT.ballRowHeight,
            iconKey: getShopIconKey(ballId),
            texture: config.brickTexture,
            title: config.name,
            detail: `${config.desc}  ${getShopBallLevelLabel(ballId, level)}`,
            dimPreview: !unlocked && ballId !== "default",
            equipped
          };

          if (!unlocked) {
            if (ballId === "default") {
              rowOptions.actionLabel = "기본";
              rowOptions.actionTexture = "element_grey_rectangle";
              rowOptions.dimmed = true;
              rowOptions.onAction = () => this.showShopToast("기본 공입니다");
              rowOptions.equipLabel = equipped ? "장착중" : "장착하기";
              rowOptions.equipTexture = equipped ? "element_grey_rectangle" : "element_green_rectangle";
              rowOptions.equipDimmed = equipped;
              rowOptions.onEquip = equipped ? null : () => this.equipShopBall("default");
            } else {
              rowOptions.actionLabel = `해금 ${config.unlockCost}`;
              rowOptions.actionTexture = "element_blue_rectangle";
              rowOptions.onAction = () => this.unlockShopBall(ballId);
            }
          } else if (ballId !== "default" && level < config.maxLevel) {
            rowOptions.actionLabel = `강화 ${config.upgradeCosts[level]}`;
            rowOptions.actionTexture = "element_yellow_rectangle";
            rowOptions.onAction = () => this.upgradeShopBall(ballId);
            rowOptions.equipLabel = equipped ? "해제" : "장착하기";
            rowOptions.equipTexture = equipped ? "element_grey_rectangle" : "element_green_rectangle";
            rowOptions.onEquip = equipped ? () => this.unequipShopBall(ballId) : () => this.equipShopBall(ballId);
          } else if (ballId === "default") {
            rowOptions.actionLabel = "기본";
            rowOptions.actionTexture = "element_grey_rectangle";
            rowOptions.dimmed = true;
            rowOptions.onAction = () => this.showShopToast("기본 공입니다");
            rowOptions.equipLabel = equipped ? "장착중" : "장착하기";
            rowOptions.equipTexture = equipped ? "element_grey_rectangle" : "element_green_rectangle";
            rowOptions.equipDimmed = equipped;
            rowOptions.onEquip = equipped ? null : () => this.equipShopBall("default");
          } else {
            rowOptions.actionLabel = "MAX";
            rowOptions.actionTexture = "element_grey_rectangle";
            rowOptions.dimmed = true;
            rowOptions.onAction = () => this.showShopToast("최대 강화입니다");
            rowOptions.equipLabel = equipped ? "해제" : "장착하기";
            rowOptions.equipTexture = equipped ? "element_grey_rectangle" : "element_green_rectangle";
            rowOptions.onEquip = equipped ? () => this.unequipShopBall(ballId) : () => this.equipShopBall(ballId);
          }

          this.addShopRow(rowOptions);
        });
        this.setupShopListScroll(ballIds.length, SHOP_LAYOUT.ballRowStep, SHOP_LAYOUT.ballRowHeight);
      }

      buildItemShopRows() {
        const mission = loadDailyMission();
        const adCoinRemaining = getAdCoinRemaining();
        const runBoostIds = ["blaze", "thunder", "pierce"];

        this.addShopRow({
          y: getShopRowY(0, SHOP_LAYOUT.itemRowStep, SHOP_LAYOUT.itemRowHeight),
          rowHeight: SHOP_LAYOUT.itemRowHeight,
          iconKey: "shopIcon_ad",
          texture: "element_yellow_rectangle",
          title: "광고로 코인 받기",
          detail: canWatchAdForCoins()
            ? `보상 ${AD_COIN_REWARD} 코인 · 오늘 ${adCoinRemaining}/${AD_COIN_DAILY_LIMIT}회`
            : "오늘 광고 코인 한도를 모두 사용했습니다",
          actionLabel: canWatchAdForCoins() ? "광고" : "완료",
          actionTexture: canWatchAdForCoins() ? "element_red_rectangle" : "element_grey_rectangle",
          dimmed: !canWatchAdForCoins(),
          onAction: () => this.watchAdForCoins()
        });

        this.addShopRow({
          y: getShopRowY(1, SHOP_LAYOUT.itemRowStep, SHOP_LAYOUT.itemRowHeight),
          rowHeight: SHOP_LAYOUT.itemRowHeight,
          iconKey: "shopIcon_mission",
          texture: "element_green_rectangle",
          title: "일일 미션",
          detail: mission.claimed
            ? "오늘 보상 수령 완료"
            : `브릭 ${Math.min(mission.bricks, DAILY_MISSION_GOAL)}/${DAILY_MISSION_GOAL} 파괴 · 보상 ${DAILY_MISSION_REWARD} 코인`,

          actionTexture: mission.bricks >= DAILY_MISSION_GOAL && !mission.claimed ? "element_yellow_rectangle" : "element_grey_rectangle",

        clearRunBoost();
        setPaddleItemForRun(itemId);

        this.showShopToast(`${item.name} · 다음 1판 적용`);

        const buttonX = GAME_WIDTH - 36 - 38;

        const shopButtonHeight = 34;
        const detailWidth = buttonX - textX - 44;

        const equipY = hasEquipButton ? y + 16 : y + 2;
        const rowTop = y - rowHeight / 2 + 2;

        const rowBg = this.add.graphics();
        rowBg.fillStyle(0xffffff, options.equipped ? 0.1 : 0.04);
        rowBg.lineStyle(options.equipped ? 2 : 1, options.equipped ? 0xffcf5a : 0x72f6ff, options.equipped ? 0.72 : 0.16);

        rowBg.strokeRoundedRect(rowLeft, rowTop, rowWidth, rowHeight, 14);

        const iconKey = options.iconKey || options.texture;
        const preview = this.add.image(iconX, hasEquipButton ? y - 8 : y + 1, iconKey).setDepth(66);

        } else {
          preview.setDisplaySize(44, 20);
        }
        if (options.dimPreview) preview.setAlpha(0.45);

        const name = this.add.text(textX, (hasEquipButton ? y - 8 : y) - 18, options.title, {

          fontStyle: "900",

        }).setDepth(66);

          color: "#d8e4ff",

        }).setDepth(66);

        const rowItems = [rowBg, preview, name, detail];

        if (options.equipped) {

          rowItems.push(badge);

            buttonX,
            actionY,
            shopButtonWidth,
            shopButtonHeight,
            options.actionLabel,
            options.onAction,

              depth: 66,
              fontSize: "10px",
              brickTexture: options.actionTexture || "element_blue_rectangle",
              dimmed: options.dimmed,
              strokeThickness: 2
            }

          rowItems.push(actionButton);

            equipY,

            options.equipLabel,
            options.onEquip || (() => this.showShopToast("현재 장착 중입니다")),

      async buyPremiumProduct(productId) {
        const catalog = IAP_CATALOG[productId];
        if (!catalog) return;
        if (catalog.type === "non_consumable" && isProductOwned(productId)) {
          this.showShopToast("이미 보유 중입니다");
          return;
        }

        this.showShopToast("결제 진행 중...");
        const result = await PurchaseService.purchase(productId);
        if (!result.ok) {
          this.showShopToast(result.message || "결제 실패");
          return;
        }

        this.shopState = loadShopState();
        this.refreshCoinDisplay();
        this.lockShopInput();
        this.scheduleShopItemsRebuild();
        this.showShopToast(`${catalog.name} 적용 완료`);

        if (productId === "remove_banner_forever" || productId === "starter_pack_forever") {
          AdService.removeBanner();
        }
      }

      buyRunBoostWithCoins(ballId) {
        if (this.coins < RUN_BOOST_COIN_COST) {
          this.showShopToast("코인이 부족합니다");
          return;
        }

        this.coins = saveCoins(this.coins - RUN_BOOST_COIN_COST);
        clearPaddleItemForRun();
        setRunBoostBallId(ballId);
        this.refreshCoinDisplay();
        this.showShopToast(`${getShopBallConfig(ballId).name} 1판 적용`);
      }

      async watchAdForTrialBall(ballId) {
        if (!canUseDailyTrial()) {
          this.showShopToast("오늘은 이미 사용했습니다");
          return;
        }

        const watched = await AdService.showRewarded();
        if (!watched) {
          this.showShopToast("광고 시청이 완료되지 않았습니다");
          return;
        }

        markDailyTrialUsed(ballId);
        setRunBoostBallId(ballId);
        this.lockShopInput();
        this.scheduleShopItemsRebuild();
        this.showShopToast(`${getShopBallConfig(ballId).name} 체험 1판 적용`);
      }

      unlockShopBall(ballId) {
        if (this.isShopInputLocked()) return;
        const config = getShopBallConfig(ballId);
        if (this.shopState.unlocked[ballId]) return;

        if (this.coins < config.unlockCost) {
          this.showShopToast("코인이 부족합니다");
          return;
        }

        this.coins = saveCoins(this.coins - config.unlockCost);
        this.shopState = loadShopState();
        this.shopState.unlocked[ballId] = true;
        this.shopState.equipped = ballId;
        clearRunBoost();
        saveShopState(this.shopState);
        this.refreshCoinDisplay();
        this.lockShopInput();
        this.scheduleShopItemsRebuild();
        this.showShopToast(`${config.name} 해금 · 자동 장착`);
      }

      upgradeShopBall(ballId) {
        if (this.isShopInputLocked()) return;
        this.shopState = loadShopState();
        const config = getShopBallConfig(ballId);
        const level = this.shopState.levels[ballId] || 0;
        if (!this.shopState.unlocked[ballId] || level >= config.maxLevel) return;

        const cost = config.upgradeCosts[level];
        if (this.coins < cost) {
          this.showShopToast("코인이 부족합니다");
          return;
        }

        this.coins = saveCoins(this.coins - cost);
        this.shopState.levels[ballId] = level + 1;
        saveShopState(this.shopState);
        this.refreshCoinDisplay();
        this.lockShopInput();
        this.scheduleShopItemsRebuild();
        this.showShopToast(`${config.name} Lv.${level + 1} 강화!`);
      }

      equipShopBall(ballId) {
        if (this.isShopInputLocked()) return;
        this.shopState = loadShopState();
        if (!this.shopState.unlocked[ballId]) return;
        if (this.shopState.equipped === ballId) return;
        this.shopState.equipped = ballId;
        clearRunBoost();
        saveShopState(this.shopState);
        this.lockShopInput();
        this.scheduleShopItemsRebuild();
        this.showShopToast("장착 되었습니다");
      }

      unequipShopBall(ballId) {
        if (this.isShopInputLocked()) return;
        this.shopState = loadShopState();
        if (this.shopState.equipped !== ballId || ballId === "default") return;
        this.shopState.equipped = "default";
        clearRunBoost();
        saveShopState(this.shopState);
        this.lockShopInput();
        this.scheduleShopItemsRebuild();
        this.showShopToast("해제되었습니다");
      }

      createProfileInputElement() {
        const canvas = this.sys.game.canvas;
        const input = document.createElement("input");
        const syncInputPosition = () => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = rect.width / GAME_WIDTH;
          const scaleY = rect.height / GAME_HEIGHT;
          const viewport = window.visualViewport;
          const viewportOffsetTop = viewport ? viewport.offsetTop : 0;
          const viewportHeight = viewport ? viewport.height : window.innerHeight;

          input.style.left = `${rect.left + 82 * scaleX}px`;
          input.style.top = `${rect.top + viewportOffsetTop + 376 * scaleY}px`;
          input.style.width = `${(GAME_WIDTH - 164) * scaleX}px`;
          input.style.height = `${34 * scaleY}px`;
          input.style.font = `800 ${Math.max(16, 18 * scaleY)}px Inter, Arial, sans-serif`;
          input.style.borderRadius = `${12 * scaleY}px`;

          const inputBottom = rect.top + viewportOffsetTop + (376 + 34) * scaleY;
          const keyboardTop = viewportOffsetTop + viewportHeight;
          if (inputBottom > keyboardTop - 12) {
            input.style.top = `${keyboardTop - 12 - 34 * scaleY}px`;
          }
        };

        input.type = "text";
        input.value = this.playerName;
        input.maxLength = 20;
        input.autocomplete = "off";
        input.inputMode = "text";
        input.style.position = "fixed";
        input.style.border = "0";
        input.style.outline = "0";
        input.style.background = "rgba(255, 255, 255, 0.02)";
        input.style.color = "#ffffff";
        input.style.textAlign = "center";
        input.style.zIndex = "9999";
        input.style.caretColor = "#72f6ff";
        input.style.userSelect = "text";
        input.style.webkitUserSelect = "text";
        input.style.touchAction = "manipulation";
        input.style.transform = "translateZ(0)";

        syncInputPosition();

        input.addEventListener("focus", () => {
          AdService.removeBanner();
          window.scrollTo(0, 0);
          syncInputPosition();
        });
        input.addEventListener("blur", () => window.scrollTo(0, 0));

        const handleViewportChange = () => {
          if (!this.profileInput) return;
          syncInputPosition();
        };
        this.profileViewportHandler = handleViewportChange;
        window.visualViewport?.addEventListener("resize", handleViewportChange);
        window.visualViewport?.addEventListener("scroll", handleViewportChange);
        window.addEventListener("resize", handleViewportChange);

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            this.commitProfileName();
          }

          if (event.key === "Escape") {
            this.closeProfilePopup();
          }
        });

        document.body.appendChild(input);
        input.focus();
        input.select();
        this.profileInput = input;
      }

      commitProfileName() {
        if (!this.profileInput) {

        }

        this.playerName = savePlayerName(this.profileInput.value);
        this.closeProfilePopup();
        this.nameButton.destroy();

      addVolumeControl(key, label, y) {
        const name = this.add.text(70, y - 22, label, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "15px",
          fontStyle: "900",
          color: "#ffffff"
        });
        const value = this.add.text(GAME_WIDTH - 70, y - 22, `${this.settings[key]}%`, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "15px",
          fontStyle: "900",
          color: "#72f6ff"
        }).setOrigin(1, 0);
        const track = this.add.graphics();
        track.fillStyle(0xffffff, 0.12);
        track.fillRoundedRect(70, y + 8, GAME_WIDTH - 140, 10, 5);
        const fill = this.add.graphics();
        const minus = this.addBrickButton(82, y + 38, 52, 34, "-", () => this.adjustVolume(key, -10), {
          depth: 61,
          fontSize: "20px",
          brickTexture: "element_grey_rectangle",
          dimmed: true,
          strokeThickness: 2
        });
        const plus = this.addBrickButton(GAME_WIDTH - 82, y + 38, 52, 34, "+", () => this.adjustVolume(key, 10), {
          depth: 61,
          fontSize: "20px",
          brickTexture: "element_blue_rectangle",
          strokeThickness: 2
        });

        this.settingsVolumeTexts[key] = { value, fill, y };
        this.settingsModal.add([name, value, track, fill, minus, plus]);
        this.updateVolumeControl(key);
      }

      adjustVolume(key, amount) {
        this.settings[key] = Phaser.Math.Clamp((Number(this.settings[key]) || 0) + amount, 0, 100);
        this.settings.sound = this.settings.sfxVolume > 0 || this.settings.bgmVolume > 0;
        saveSettings(this.settings);
        this.updateVolumeControl(key);
        if (key === "bgmVolume") {
          BgmService.start(this, this.settings);
          BgmService.update(this.settings);
        }
      }

      updateVolumeControl(key) {
        const control = this.settingsVolumeTexts[key];

        if (!control) {
          return;
        }

        const width = (GAME_WIDTH - 140) * (this.settings[key] / 100);
        control.value.setText(`${this.settings[key]}%`);
        control.fill.clear();

      createRankingTabs(y, depth, onSelect, parent = null) {
        const tabs = { y, depth, onSelect, parent, buttons: [] };
        this.updateRankingTabs(tabs);

      }

      updateRankingTabs(tabs) {
        tabs.buttons.forEach((button) => button.destroy());
        tabs.buttons = [];

        [
          { mode: "stage", label: "스테이지 랭킹", x: GAME_WIDTH / 2 - 78 },

          const button = this.addBrickButton(tab.x, tabs.y, 144, 34, tab.label, () => {

            depth: tabs.depth,
            fontSize: "12px",
            brickTexture: selected ? "element_blue_rectangle" : "element_grey_rectangle",

            strokeThickness: 2
          });

          tabs.buttons.push(button);

          if (tabs.parent) {
            tabs.parent.add(button);
          }

      async refreshRankings(forceModal) {
        this.setRankingLoading("로딩 중...");
        if (forceModal && this.rankingModalStatus) {
          this.rankingModalRows.forEach((row) => row.destroy());
          this.rankingModalRows = [];
          this.rankingModalStatus.setVisible(true);
          this.rankingModalStatus.setText("로딩 중...");
        }

        try {
          const rankings = await fetchRankings(this.rankingMode);
          this.renderRankings(rankings);

          if (forceModal && this.rankingModal) {
            this.renderModalRankings(rankings);
          }
        } catch (error) {
          this.setRankingLoading("랭킹을 불러오지 못했습니다.");

          if (forceModal && this.rankingModalStatus) {
            this.rankingModalStatus.setText("랭킹을 불러오지 못했습니다.");
          }
        }
      }

      setRankingLoading(message) {
        this.rankingItems.forEach((item) => item.destroy());
        this.rankingItems = [];
        this.rankingStatus.setText(message).setVisible(true);
      }

      renderRankings(rankings) {
        this.rankingStatus.setVisible(rankings.length === 0);
        this.rankingStatus.setText(rankings.length === 0 ? "아직 랭킹이 없습니다." : "");
        this.rankingItems.forEach((item) => item.destroy());
        this.rankingItems = [];

        const topRankings = rankings.slice(0, MAIN_RANKING_VISIBLE_COUNT);
        topRankings.forEach((rank, index) => {
          const y = this.rankingListStartY + index * this.rankingRowStep;
          const row = this.add.text(54, y, `${rank.rank}. ${rank.name}`, {
            fontFamily: "Inter, Arial, sans-serif",
            fontSize: this.rankingRowFontSize || "13px",
            fontStyle: "800",
            color: "#ffffff"
          }).setDepth(6);
          const score = this.add.text(330, y, String(rank.score), {
            fontFamily: "Inter, Arial, sans-serif",
            fontSize: this.rankingRowFontSize || "13px",
            fontStyle: "900",
            color: "#72f6ff"
          }).setOrigin(1, 0).setDepth(6);

          this.rankingItems.push(row, score);
        });

        const myRank = getMyRankingEntry(rankings, this.playerName, this.rankingMode);
        const myY = this.rankingMyRowY;
        const divider = this.add.graphics().setDepth(6);
        divider.lineStyle(1, 0x72f6ff, 0.22);
        divider.lineBetween(48, myY - 6, GAME_WIDTH - 48, myY - 6);

        const myBg = this.add.graphics().setDepth(6);
        myBg.fillStyle(0xffcf5a, 0.12);
        myBg.fillRoundedRect(42, myY - 2, GAME_WIDTH - 84, this.rankingRowStep + 4, 8);

        const rankLabel = myRank.unranked ? "MY —" : `MY #${myRank.rank}`;
        const myRow = this.add.text(54, myY, `${rankLabel}  ${myRank.name}`, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: this.rankingRowFontSize || "13px",
          fontStyle: "900",
          color: "#ffcf5a"
        }).setDepth(6);
        const myScore = this.add.text(330, myY, String(myRank.score), {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: this.rankingRowFontSize || "13px",
          fontStyle: "900",
          color: "#ffcf5a"
        }).setOrigin(1, 0).setDepth(6);

        this.rankingItems.push(divider, myBg, myRow, myScore);
      }

      showRankingModal() {

        }).setOrigin(0.5);

    class GameScene extends BaseScene {
      constructor() {
        super("GameScene");
      }

      init(data) {
        this.playerName = data.playerName || loadPlayerName();
        this.settings = data.settings || loadSettings();
        this.mode = data.mode || "normal";
        this.startStage = this.mode === "normal"
          ? Phaser.Math.Clamp(Math.floor(Number(data.startStage) || 1), 1, getMaxUnlockedStage())
          : 1;
        this.scoreMode = getScoreMode(this.mode);
        this.shopState = loadShopState();
        this.pendingRunBoostBallId = getRunBoostBallId();
        if (this.pendingRunBoostBallId) {
          clearRunBoost();
        }
        this.paddleItemId = data.paddleItemId || getPaddleItemForRun() || null;
        if (this.paddleItemId) {
          clearPaddleItemForRun();
        }
        this.equippedBallId = this.resolveEquippedBallId();
      }

      resolveEquippedBallId() {
        this.shopState = loadShopState();
        return resolveEquippedBallId(this.mode, this.shopState, this.pendingRunBoostBallId);
      }

      refreshEquippedBallState() {
        this.shopState = loadShopState();
        this.equippedBallId = this.resolveEquippedBallId();
      }

      getEquippedBallLevel(ballId) {
        const level = this.shopState?.levels?.[ballId] || 0;
        if (this.pendingRunBoostBallId === ballId && !this.shopState?.unlocked?.[ballId]) {
          return Math.max(1, level);
        }
        return level;
      }

      create() {
        this.refreshEquippedBallState();
        this.physics.resume();
        if (this.physics.world) {
          this.physics.world.isPaused = false;
        }
        this.score = 0;
        this.stage = this.startStage || 1;
        this.lives = STARTING_LIVES;
        this.coins = loadCoins();
        const baseSpeed = DIFFICULTIES[this.settings.difficulty]?.speed || 1;
        this.speedMultiplier = this.isInfiniteMode()
          ? baseSpeed
          : getSpeedMultiplierForStartStage(this.stage, baseSpeed);
        this.gameEnded = false;
        this.transitioningStage = false;
        this.respawning = false;
        this.isPaused = false;
        this.fireballActive = false;
        this.paddleExpanded = false;
        this.bricksDescending = false;
        this.awaitingRewardAd = false;
        this.rewardAdInProgress = false;
        this.descentCount = 0;
        this.nextDescentAt = 0;
        this.pendingPaddleDescentTimer = null;
        this.infiniteSpeedTier = 0;
        this.combo = 0;
        this.comboMultiplier = 1;
        this.comboDelayBonus = 0;
        this.lastBackgroundIndex = -1;
        this.twinPaddleActive = false;
        this.paddleLeft = null;
        this.paddleRight = null;
        this.best = loadBestStats(this.scoreMode);
        this.fireballDroppedThisStage = false;
        this.lastFireballDropAt = 0;
        this.stageCoinsEarned = 0;
        this.runCoinsEarned = 0;

        this.createBackground();
        ensureShopBallTextures(this);
        ensureShopIconTextures(this);
        ensurePaddleItemTextures(this);
        this.createHud();
        this.updateBallInfoDisplay();
        this.createWorld();
        this.createBricks();
        this.createControls();
        if (this.isInfiniteMode()) {
          this.scheduleNextDescent();
        }
        BgmService.start(this, this.settings);
        ScreenWakeLock.setGameplayActive(true);
        this.showEquippedBallIntro();
        this.showPaddleItemIntro();
        this.showStartPrompt("클릭·스페이스로 시작", "마우스·키보드(←→/AD)·터치로 조작");
        this.fadeInScene();

        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
          ScreenWakeLock.setGameplayActive(false);
        });
      }

      fadeInScene() {
        const fade = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x03050d, 1)
          .setDepth(999);

        this.tweens.add({
          targets: fade,
          alpha: 0,
          duration: 500,
          ease: "Sine.easeOut",
          onComplete: () => fade.destroy()
        });

        window.setTimeout(() => {
          if (fade.active) fade.destroy();
        }, 650);
      }

      update(time, delta) {
        if (this.gameEnded || this.isPaused || !this.balls) {
          return;
        }

        if ((this.pcKeyLeft || this.pcKeyRight) && this.paddle) {
          const dir = (this.pcKeyRight ? 1 : 0) - (this.pcKeyLeft ? 1 : 0);
          this.movePaddle(this.paddle.x + dir * 0.55 * delta);
        }

        this.balls.children.each((ball) => {
          if (!ball.active) return;

          if (ball.getData("attached")) {
            ball.setPosition(this.paddle.x, PADDLE_Y - BALL_ATTACH_OFFSET_Y);
            ball.setData("trailX", ball.x);
            ball.setData("trailY", ball.y);
            ball.setData("lastFrameX", ball.x);
            ball.setData("lastFrameY", ball.y);
            return;
          }

          const lastFrameX = ball.getData("lastFrameX");
          const lastFrameY = ball.getData("lastFrameY");
          ball.setData("prevVelocity", { x: ball.body.velocity.x, y: ball.body.velocity.y });
          if (ball.body.velocity.length() === 0) {
            ball.setVelocity(Phaser.Math.Between(-130, 130), -this.getStageBallSpeed());
          }
          this.createBallTrail(ball);
          this.handleSweptBrickCollision(ball, lastFrameX, lastFrameY);

          if (ball.y > GAME_HEIGHT + ball.displayHeight) {
            ball.destroy();
            return;
          }

          this.handlePaddleCollision(ball);

          if (ball.body.velocity.length() > 0 && Math.abs(ball.body.velocity.x) < 70) {
            ball.setVelocityX(ball.body.velocity.x < 0 ? -100 : 100);
          }
          this.enforceForcedBrickBounce(ball);
          ball.setData("lastFrameX", ball.x);
          ball.setData("lastFrameY", ball.y);
        });

        this.powerUps.children.each((powerUp) => {
          if (powerUp.active && powerUp.y > GAME_HEIGHT + powerUp.displayHeight) {
            powerUp.destroy();
          }
        });

        if (this.paddleBullets) {
          this.paddleBullets.children.each((bullet) => {
            if (bullet.active && bullet.y < 20) {
              bullet.destroy();
            }
          });
        }

        if (this.isInfiniteMode() && !this.transitioningStage && !this.respawning && !this.bricksDescending && this.time.now >= this.nextDescentAt) {
          this.descendBlocks("timer");
        }

        if (this.countActiveBalls() === 0 && !this.transitioningStage && !this.respawning) {
          this.loseLife();
        }

        this.updateShopBallGlows();
      }

      updateShopBallGlows() {
        if (!this.ballAuraLayer) return;

        this.ballAuraLayer.clear();
        this.balls.children.each((ball) => {
          if (!ball.active) return;

          const ballId = ball.getData("shopBallType") || "default";
          const level = ball.getData("shopBallLevel") || 0;
          const fireball = ball.getData("fireball") === true;
          const config = getShopBallConfig(fireball ? "blaze" : ballId);
          const glowColor = fireball ? 0xff6b2f : config.glowColor;
          const ringColor = fireball ? 0xffcf5a : config.trailColor;
          const alpha = ballId === "default" && !fireball ? 0.14 : 0.24 + level * 0.05;
          const outerRadius = (ball.displayWidth / 2) + 8 + level * 2;
          const innerRadius = Math.max(8, outerRadius - 5);

          this.ballAuraLayer.fillStyle(glowColor, alpha);
          this.ballAuraLayer.fillCircle(ball.x, ball.y, outerRadius);
          this.ballAuraLayer.lineStyle(2, ringColor, fireball ? 0.85 : 0.62);
          this.ballAuraLayer.strokeCircle(ball.x, ball.y, innerRadius);
        });
      }

      createBallTrail(ball) {
        const prevX = ball.getData("trailX");
        const prevY = ball.getData("trailY");

        ball.setData("trailX", ball.x);
        ball.setData("trailY", ball.y);

        if (!Number.isFinite(prevX) || !Number.isFinite(prevY)) return;
        if (Phaser.Math.Distance.Between(prevX, prevY, ball.x, ball.y) < 2) return;

        const lastTrailAt = ball.getData("lastTrailAt") || 0;
        const shopType = ball.getData("shopBallType") || "default";
        const fireball = ball.getData("fireball") === true;
        const trailInterval = shopType === "default" && !fireball ? 28 : 14;
        if (this.time.now - lastTrailAt < trailInterval) return;
        ball.setData("lastTrailAt", this.time.now);

        const config = getShopBallConfig(fireball ? "blaze" : shopType);
        const trailColor = fireball ? 0xff6b2f : (ball.getData("trailColor") || config.trailColor || 0x72f6ff);
        const glowColor = fireball ? 0xffcf5a : (ball.getData("glowColor") || config.glowColor || trailColor);
        const level = ball.getData("shopBallLevel") || 0;
        const trail = this.add.graphics().setDepth(4);
        const lineWidth = fireball ? 8 : shopType === "thunder" ? 8 : shopType === "default" ? 5 : 9;
        const lineAlpha = fireball ? 0.58 : shopType === "default" ? 0.28 : 0.48 + level * 0.04;

        trail.lineStyle(lineWidth, trailColor, lineAlpha);
        trail.beginPath();
        trail.moveTo(prevX, prevY);
        trail.lineTo(ball.x, ball.y);
        trail.strokePath();
        trail.fillStyle(glowColor, fireball ? 0.42 : shopType === "default" ? 0.2 : 0.34);
        trail.fillCircle(ball.x, ball.y, fireball ? 14 : shopType === "blaze" ? 12 + level : 10 + level);

        if (shopType === "thunder" || fireball) {
          const midX = (prevX + ball.x) / 2 + Phaser.Math.Between(-8, 8);
          const midY = (prevY + ball.y) / 2 + Phaser.Math.Between(-8, 8);
          trail.lineStyle(2, 0xffffff, fireball ? 0.75 : 0.65);
          trail.beginPath();
          trail.moveTo(prevX, prevY);
          trail.lineTo(midX, midY);
          trail.lineTo(ball.x, ball.y);
          trail.strokePath();
        }

        if (shopType === "blaze" || fireball) {
          trail.fillStyle(0xffcf5a, fireball ? 0.5 : 0.42);
          trail.fillCircle(prevX + (ball.x - prevX) * 0.45, prevY + (ball.y - prevY) * 0.45, fireball ? 6 : 5);
        }

        if (shopType === "pierce") {
          trail.lineStyle(2, 0xffffff, 0.28);
          trail.strokeCircle(ball.x, ball.y, 14 + level * 2);
          trail.fillStyle(glowColor, 0.16);
          trail.fillCircle(ball.x, ball.y, 8);
        }

        this.tweens.add({
          targets: trail,
          alpha: 0,
          duration: fireball || shopType !== "default" ? 320 : 220,
          ease: "Sine.easeOut",
          onComplete: () => trail.destroy()
        });
      }

      createBackground() {
        this.bgRect = this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x070a14).setOrigin(0);
        this.bgGlow = this.add.graphics();
        this.bgPanel = this.add.graphics();
        this.applyRandomBackground();

      applyRandomBackground() {
        let paletteIndex = Phaser.Math.Between(0, BACKGROUND_PALETTES.length - 1);

        if (BACKGROUND_PALETTES.length > 1 && paletteIndex === this.lastBackgroundIndex) {
          paletteIndex = (paletteIndex + 1) % BACKGROUND_PALETTES.length;
        }

        this.lastBackgroundIndex = paletteIndex;
        const palette = BACKGROUND_PALETTES[paletteIndex];
        this.bgRect.setFillStyle(palette.base, 1);
        this.bgGlow.clear();
        this.bgGlow.fillGradientStyle(palette.glowA, palette.glowB, palette.glowC, palette.base, 0.44, 0.24, 0.04, 0);
        this.bgGlow.fillCircle(GAME_WIDTH / 2, 88, 260);
        this.bgPanel.clear();
        this.bgPanel.lineStyle(1, 0xffffff, 0.08);
        this.bgPanel.fillStyle(0xffffff, 0.035);
        this.bgPanel.fillRoundedRect(18, 18, GAME_WIDTH - 36, GAME_HEIGHT - 58, 28);
        this.bgPanel.strokeRoundedRect(18, 18, GAME_WIDTH - 36, GAME_HEIGHT - 58, 28);

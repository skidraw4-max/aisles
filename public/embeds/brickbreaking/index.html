          .setDisplaySize(PADDLE_WIDTH, PADDLE_HEIGHT)
          .setDepth(5);
        this.paddle.refreshBody();
        this.paddle.body.setSize(this.paddle.width, this.paddle.height * 0.62, true);
        this.balls = this.physics.add.group();
        this.ballAuraLayer = this.add.graphics().setDepth(5);
        this.ball = this.createBall(GAME_WIDTH / 2, PADDLE_Y - BALL_ATTACH_OFFSET_Y, true);
        this.bricks = this.physics.add.staticGroup();
        this.powerUps = this.physics.add.group();
        this.physics.add.overlap(this.balls, this.bricks, this.safeHitBrick, null, this);
        this.physics.add.overlap(this.paddle, this.powerUps, this.collectPowerUp, null, this);
        this.paddleBullets = this.physics.add.group();
        this.physics.add.overlap(this.paddleBullets, this.bricks, this.hitBrickWithBullet, null, this);
        this.applyPaddleShopItem();
        if (this.isInfiniteMode()) {
          this.createDangerLine();
        }
      }

      isInfiniteMode() {
        return this.mode === "infinite";
      }

      getStageLabel() {
        return this.isInfiniteMode() ? "Infinite Mode" : `Stage ${this.stage}`;
      }

      getRecordStage() {
        return this.isInfiniteMode() ? 0 : this.stage;
      }

      getBestLabel() {
        return this.isInfiniteMode() ? `BEST Infinite / ${this.best.score}` : `BEST Stage ${this.best.stage} / ${this.best.score}`;
      }

      getInfiniteSpeedTier() {
        return Math.floor(this.score / (5000 * DIFFICULTY_EASE));
      }

      createDangerLine() {
        const line = this.add.graphics().setDepth(3);
        line.lineStyle(2, 0xff4d5e, 0.72);

        for (let x = 30; x < GAME_WIDTH - 30; x += 18) {
          line.beginPath();
          line.moveTo(x, DANGER_LINE_Y);
          line.lineTo(x + 9, DANGER_LINE_Y);
          line.strokePath();
        }

        this.add.text(GAME_WIDTH - 32, DANGER_LINE_Y - 20, "DANGER", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "11px",
          fontStyle: "900",
          color: "#ff7f9f"
        }).setOrigin(1, 0).setDepth(3);
      }

      createBall(x, y, attached = false, velocity = null) {
        const ballId = this.equippedBallId || "default";
        const textureKey = getShopBallTextureKey(ballId);
        const texture = this.textures.exists(textureKey) ? textureKey : "ball";
        const ball = this.balls.create(x, y, texture)
          .setDisplaySize(BALL_SIZE_DEFAULT, BALL_SIZE_DEFAULT)
          .setBounce(1)
          .setCollideWorldBounds(true)
          .setDepth(6);
        ball.body.allowGravity = false;
        ball.body.setSize(BALL_SIZE_DEFAULT - 2, BALL_SIZE_DEFAULT - 2, true);
        ball.setData("attached", attached);
        ball.setData("lastFrameX", x);
        ball.setData("lastFrameY", y);
        this.applyShopBallStyle(ball);
        this.setBallFireball(ball, this.fireballActive);

        if (velocity) {
          ball.setVelocity(velocity.x, velocity.y);
        }

        return ball;
      }

      updateBallInfoDisplay() {
        if (!this.ballInfoText) return;

        const ballId = this.equippedBallId || "default";
        const config = getShopBallConfig(ballId);
        const level = this.getEquippedBallLevel(ballId);
        const dmg = getShopBallDamage(ballId, level);
        const hint = getShopBallEffectHint(ballId, level);
        this.ballInfoText.setText(`● ${config.name}  Lv.${level}  DMG ${dmg}  · ${hint}`);
        this.ballInfoText.setColor(colorIntToCss(config.trailColor));
      }

      showEquippedBallIntro() {
        const ballId = this.pendingRunBoostBallId || this.equippedBallId || "default";
        const config = getShopBallConfig(ballId);
        const level = this.getEquippedBallLevel(ballId);
        const dmg = getShopBallDamage(ballId, level);
        const prefix = this.pendingRunBoostBallId ? "1판 체험" : "장착";
        this.showFloatingText(
          GAME_WIDTH / 2,
          124,
          `${prefix} · ${config.name} · DMG ${dmg}`,
          colorIntToCss(config.trailColor),
          18
        );

        if (this.ball?.active) {
          this.tweens.add({
            targets: this.ball,
            scaleX: 1.18,
            scaleY: 1.18,
            yoyo: true,
            duration: 220,
            repeat: 2,
            ease: "Sine.easeInOut",
            onComplete: () => {
              if (this.ball?.active) {
                this.ball.setScale(1);
              }
            }
          });
        }
      }

      resolvePaddleTextureKey() {
        return getPaddleTextureKey(this.paddleItemId);
      }

      applyPaddleVisual(width = this.paddle?.displayWidth || PADDLE_WIDTH) {
        const textureKey = this.resolvePaddleTextureKey();
        const resolvedKey = this.textures.exists(textureKey) ? textureKey : "paddle";

        const applyToPart = (paddlePart, partWidth) => {
          if (!paddlePart?.active) return;
          paddlePart.setTexture(resolvedKey);
          paddlePart.setDisplaySize(partWidth, PADDLE_HEIGHT);
          paddlePart.refreshBody();
          paddlePart.body.setSize(paddlePart.width, paddlePart.height * 0.62, true);
        };

        if (this.twinPaddleActive && this.paddleLeft?.active && this.paddleRight?.active) {
          const halfWidth = width / 2;
          applyToPart(this.paddleLeft, halfWidth);
          applyToPart(this.paddleRight, halfWidth);
          return;
        }

        applyToPart(this.paddle, width);
      }

      showPaddleItemIntro() {
        const item = getPaddleShopItem(this.paddleItemId);
        if (!item) return;

        this.showFloatingText(
          GAME_WIDTH / 2,
          150,
          `패들 아이템 · ${item.name}`,
          item.id === "splitBounce" ? "#72f6ff" : item.id === "twinPaddle" ? "#5cff9d" : "#ffcf5a",
          16
        );
      }

      applyPaddleShopItem() {
        if (!this.paddleItemId) return;

        this.twinPaddleActive = this.paddleItemId === "twinPaddle";
        if (this.twinPaddleActive) {
          this.setupTwinPaddles();
        } else {
          this.applyPaddleVisual(PADDLE_WIDTH);
        }

        if (this.paddleItemId === "cannonPaddle") {
          this.startCannonPaddleAutoFire();
        }
      }

      startCannonPaddleAutoFire() {
        if (this.paddleItemId !== "cannonPaddle") return;
        this.stopCannonPaddleAutoFire();
        this.cannonPaddleTimer = this.time.addEvent({
          delay: PADDLE_ITEM_CANNON_INTERVAL_MS,
          loop: true,
          callback: () => this.tryAutoFirePaddleBullet()
        });
      }

      stopCannonPaddleAutoFire() {
        if (this.cannonPaddleTimer) {
          this.cannonPaddleTimer.remove(false);
          this.cannonPaddleTimer = null;
        }
      }

      getCannonFirePosition() {
        const centerX = this.paddle?.x || GAME_WIDTH / 2;
        const paddleTop = this.twinPaddleActive && this.paddleLeft?.active
          ? this.paddleLeft.y - this.paddleLeft.displayHeight / 2
          : this.paddle.y - this.paddle.displayHeight / 2;
        return { x: centerX, y: paddleTop - 8 };
      }

      tryAutoFirePaddleBullet() {
        if (this.paddleItemId !== "cannonPaddle") return;
        if (this.gameEnded || this.isPaused || this.transitioningStage || this.respawning) return;
        const { x, y } = this.getCannonFirePosition();
        this.firePaddleBullet(x, y);
      }

      setupTwinPaddles() {
        const halfWidth = PADDLE_WIDTH / 2;
        const centerX = this.paddle.x;
        const textureKey = this.resolvePaddleTextureKey();
        const resolvedKey = this.textures.exists(textureKey) ? textureKey : "paddle";

        this.paddle.setVisible(false);
        if (this.paddle.body) {
          this.paddle.body.enable = false;
        }

        this.paddleLeft = this.physics.add.staticImage(centerX - halfWidth / 2, PADDLE_Y, resolvedKey)
          .setDisplaySize(halfWidth, PADDLE_HEIGHT)
          .setDepth(5);
        this.paddleRight = this.physics.add.staticImage(centerX + halfWidth / 2, PADDLE_Y, resolvedKey)
          .setDisplaySize(halfWidth, PADDLE_HEIGHT)
          .setDepth(5);

        [this.paddleLeft, this.paddleRight].forEach((paddlePart) => {
          paddlePart.refreshBody();
          paddlePart.body.setSize(paddlePart.width, paddlePart.height * 0.62, true);
          this.physics.add.overlap(paddlePart, this.powerUps, this.collectPowerUp, null, this);
        });
      }

      teardownTwinPaddles() {
        if (this.paddleLeft) {
          this.paddleLeft.destroy();
          this.paddleLeft = null;
        }
        if (this.paddleRight) {
          this.paddleRight.destroy();
          this.paddleRight = null;
        }

        if (this.paddle?.active) {
          this.paddle.setVisible(true);
          if (this.paddle.body) {
            this.paddle.body.enable = true;
            this.paddle.refreshBody();
          }
        }

        this.twinPaddleActive = false;
        if (this.paddleItemId) {
          this.applyPaddleVisual(this.paddle?.displayWidth || PADDLE_WIDTH);
        }
      }

      getPaddleTouchTargets() {
        if (this.twinPaddleActive && this.paddleLeft?.active && this.paddleRight?.active) {
          return [this.paddleLeft, this.paddleRight];
        }
        return this.paddle?.active ? [this.paddle] : [];
      }

      getTotalPaddleWidth() {
        if (this.twinPaddleActive) {
          return (this.paddleLeft?.displayWidth || 0) + (this.paddleRight?.displayWidth || 0);
        }
        return this.paddle?.displayWidth || PADDLE_WIDTH;
      }

      trySplitBounceFromBall(ball) {
        if (this.paddleItemId !== "splitBounce" || Math.random() >= PADDLE_ITEM_SPLIT_CHANCE) return;
        if (this.countActiveBalls() >= this.getMaxActiveBalls()) return;

        const speed = Math.max(this.getStageBallSpeed(), Math.hypot(ball.body.velocity.x, ball.body.velocity.y));
        const sourceAngle = Phaser.Math.Angle.Between(0, 0, ball.body.velocity.x, ball.body.velocity.y);
        const spawnAngle = sourceAngle + Phaser.Math.FloatBetween(-0.55, 0.55);

        this.createBall(ball.x, ball.y, false, {
          x: Math.cos(spawnAngle) * speed,
          y: Math.sin(spawnAngle) * speed
        });
        this.showFloatingText(ball.x, ball.y - 24, "SPLIT!", "#72f6ff", 14);
      }

      countActivePaddleBullets() {
        if (!this.paddleBullets) return 0;
        return this.paddleBullets.getChildren().filter((bullet) => bullet.active).length;
      }

      firePaddleBullet(x, y) {
        if (this.paddleItemId !== "cannonPaddle") return;
        if (!this.paddleBullets || this.countActivePaddleBullets() >= PADDLE_ITEM_MAX_BULLETS) return;

        const bullet = this.paddleBullets.create(x, y, "paddleBullet")
          .setDisplaySize(14, 18)
          .setDepth(6);
        bullet.body.allowGravity = false;
        bullet.body.setSize(12, 16, true);
        bullet.setVelocityY(-420);
        bullet.setData("damage", 1);
      }

      hitBrickWithBullet(bullet, brick) {
        if (!bullet?.active || !brick?.active) return;
        bullet.destroy();
        this.damageBrickFromSource(brick, 1, 0xffcf5a);
      }

      damageBrickFromSource(brick, damage, impactColor = 0x72f6ff) {
        const lastHit = brick.getData("lastHitAt") || 0;
        if (this.time.now - lastHit < 70) return;

        brick.setData("lastHitAt", this.time.now);
        const currentHp = Math.max(1, Number(brick.getData("hp")) || 1);
        const maxHp = Math.max(currentHp, Number(brick.getData("maxHp")) || currentHp);
        brick.setData("maxHp", maxHp);
        const nextHp = Math.max(0, currentHp - damage);
        brick.setData("hp", nextHp);
        playBrickHitSfx(this.settings, maxHp);
        this.showBrickImpactEffect(brick.x, brick.y, impactColor, damage);
        this.cameras.main.shake(80, damage > 1 ? 0.002 : 0.0014);

        if (nextHp > 0) {
          this.score += 2;
          this.updateScore();
          this.updateBrickHpVisual(brick);
          this.tweens.add({
            targets: brick,
            alpha: 0.55,
            scaleX: 0.9,
            scaleY: 0.9,
            duration: 65,
            yoyo: true,
            onComplete: () => this.updateBrickHpVisual(brick)
          });
          return;
        }

        this.destroyBrick(brick, true, false);
        this.checkStageClear();
      }

      applyShopBallStyle(ball) {
        this.refreshEquippedBallState();

        const ballId = this.equippedBallId || "default";
        const level = this.getEquippedBallLevel(ballId);
        const config = getShopBallConfig(ballId);
        const textureKey = getShopBallTextureKey(ballId);

        ball.setData("shopBallType", ballId);
        ball.setData("shopBallLevel", level);
        ball.setData("trailColor", config.trailColor);
        ball.setData("glowColor", config.glowColor);

        if (this.textures.exists(textureKey)) {
          ball.setTexture(textureKey);
        } else {
          ball.setTexture("ball");
        }

        ball.clearTint();
        const size = ballId === "default"
          ? BALL_SIZE_DEFAULT
          : BALL_SIZE_UPGRADED_BASE + Math.min(level, 3) * BALL_SIZE_UPGRADED_STEP;
        ball.setDisplaySize(size, size);
        if (ball.body) {
          ball.body.setSize(size - 2, size - 2, true);
        }
      }

      getBallHitDamage(ball, brick, fireballHit) {
        if (fireballHit) {
          return Math.max(1, Number(brick.getData("hp")) || 1);
        }

        const ballId = ball.getData("shopBallType") || "default";
        const level = ball.getData("shopBallLevel") || 0;
        return getShopBallDamage(ballId, level);
      }

      shouldBallPassThrough(ball, brick, currentHp, damage, fireballHit) {
        if (fireballHit) return true;

        const ballId = ball.getData("shopBallType") || "default";
        const level = ball.getData("shopBallLevel") || 0;
        const config = getShopBallConfig(ballId);

        if (damage < currentHp) return false;
        if (config.passThrough && level >= 1) return true;
        if (ballId === "blaze" && level >= 2 && currentHp <= 2) return true;
        return false;
      }

      getShopImpactColor(ball) {
        const ballId = ball.getData("shopBallType") || "default";
        const config = getShopBallConfig(ballId);
        return config.glowColor || config.trailColor || 0x72f6ff;
      }

      createBricks() {
        this.bricks.clear(true, true);
        if (this.isInfiniteMode()) {
          this.generateTopBrickLine();
          return;
        }

        const rows = Phaser.Math.Clamp(4 + Math.floor((this.stage - 1) / 4), 4, 6);
        const positions = [];

        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < BRICK_COLS; col += 1) {
            positions.push({ row, col });
          }
        }

        this.shuffleArray(positions);
        const minimumBricks = Math.min(9 + Math.ceil(this.stage * GLOBAL_DIFFICULTY_SCALE), positions.length);
        const brickCount = Phaser.Math.Between(minimumBricks, positions.length);

        for (let index = 0; index < brickCount; index += 1) {
          const pos = positions[index];
          this.createBrickAt(pos.row, pos.col);
        }
      }

      createBrickAt(row, col, forceSpecial = null) {
        const x = this.getBrickX(col);
        const y = BRICK_START_Y + row * BRICK_ROW_STEP;
        const texture = BRICK_TEXTURES[Phaser.Math.Between(0, BRICK_TEXTURES.length - 1)];
        const brick = this.bricks.create(x, y, texture)
          .setDisplaySize(BRICK_WIDTH, BRICK_HEIGHT)
          .setAlpha(0.96);
        const hp = this.getBrickHp();
        const special = forceSpecial || this.rollSpecialBrick();

        brick.setData("hp", hp);
        brick.setData("maxHp", hp);
        brick.setData("row", row);
        brick.setData("col", col);
        brick.setData("special", special);
        brick.refreshBody();
        if (brick.body && typeof brick.body.setSize === "function") {
          brick.body.setSize(BRICK_WIDTH + 8, BRICK_HEIGHT + 8, true);
        }
        this.updateBrickHpVisual(brick);
        this.updateSpecialBrickVisual(brick);
        return brick;
      }

      getBrickX(col) {
        const startX = (GAME_WIDTH - ((BRICK_COLS - 1) * (BRICK_WIDTH + BRICK_GAP_X))) / 2;
        return startX + col * (BRICK_WIDTH + BRICK_GAP_X);
      }

      rollSpecialBrick() {
        const roll = Math.random();

        if (roll < 0.07) return "bomb";
        if (roll < 0.14) return "line";
        return null;
      }

      updateSpecialBrickVisual(brick) {
        const special = brick.getData("special");

        if (!special) return;

        brick.setTint(special === "bomb" ? 0xff4d5e : 0x72f6ff);
        const label = this.add.text(brick.x, brick.y, special === "bomb" ? "B" : "L", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "13px",
          fontStyle: "900",
          color: "#ffffff",
          stroke: "#11182b",
          strokeThickness: 3
        }).setOrigin(0.5).setDepth(4);
        brick.setData("specialLabel", label);
      }

      createControls() {
        this.input.addPointer(2);
        this.input.on("pointermove", (pointer) => {
          // Touch: require contact. Mouse/pen: follow cursor without button hold (PC).
          const isTouch = pointer.pointerType === "touch";
          if ((isTouch && !pointer.isDown) || this.gameEnded || this.isPaused || this.transitioningStage) return;
          pointer.event?.preventDefault?.();
          this.movePaddle(this.getPointerGameX(pointer));
        });
        this.input.on("pointerdown", (pointer) => {
          if (this.isPaused || this.transitioningStage) return;
          pointer.event?.preventDefault?.();
          this.movePaddle(this.getPointerGameX(pointer));
          this.launchAttachedBall();
        });

        this.bindNativeTouchControls();
        this.bindPcKeyboardControls();
      }

      bindPcKeyboardControls() {
        this.pcKeyLeft = false;
        this.pcKeyRight = false;

        this._pcKeyDown = (event) => {
          if (event.target?.tagName === "INPUT" || event.target?.tagName === "TEXTAREA") return;
          const key = event.key;
          if (key === "ArrowLeft" || key === "a" || key === "A") {
            this.pcKeyLeft = true;
            event.preventDefault();
          } else if (key === "ArrowRight" || key === "d" || key === "D") {
            this.pcKeyRight = true;
            event.preventDefault();
          } else if (key === " " || key === "Spacebar" || event.code === "Space" || key === "Enter") {
            if (event.repeat) return;
            event.preventDefault();
            if (!this.gameEnded && !this.isPaused && !this.transitioningStage) {
              this.launchAttachedBall();
            }
          }
        };

        this._pcKeyUp = (event) => {
          const key = event.key;
          if (key === "ArrowLeft" || key === "a" || key === "A") this.pcKeyLeft = false;
          if (key === "ArrowRight" || key === "d" || key === "D") this.pcKeyRight = false;
        };

        window.addEventListener("keydown", this._pcKeyDown);
        window.addEventListener("keyup", this._pcKeyUp);

        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
          window.removeEventListener("keydown", this._pcKeyDown);
          window.removeEventListener("keyup", this._pcKeyUp);
          this.pcKeyLeft = false;
          this.pcKeyRight = false;
        });
      }

      getPointerGameX(pointer) {
        const canvas = this.game.canvas;
        const rect = canvas.getBoundingClientRect();
        const clientX = pointer.event?.clientX ?? pointer.event?.touches?.[0]?.clientX ?? pointer.event?.changedTouches?.[0]?.clientX;

        if (Number.isFinite(clientX) && rect.width > 0) {
          return ((clientX - rect.left) / rect.width) * GAME_WIDTH;
        }

        return pointer.x;
      }

      bindNativeTouchControls() {
        const canvas = this.game.canvas;
        const handleTouch = (event) => {
          if (this.gameEnded || this.isPaused || this.transitioningStage) return;
          if (event.target?.tagName === "INPUT") return;

          const touch = event.touches?.[0] || event.changedTouches?.[0] || event;
          if (!touch || !Number.isFinite(touch.clientX)) return;

          event.preventDefault?.();
          const rect = canvas.getBoundingClientRect();
          const gameX = ((touch.clientX - rect.left) / rect.width) * GAME_WIDTH;
          this.movePaddle(gameX);

          if (event.type === "touchstart" || event.type === "pointerdown") {
            this.launchAttachedBall();
          }
        };

        canvas.addEventListener("touchstart", handleTouch, { passive: false });
        canvas.addEventListener("touchmove", handleTouch, { passive: false });
        canvas.addEventListener("pointerdown", handleTouch, { passive: false });
        canvas.addEventListener("pointermove", handleTouch, { passive: false });
        window.addEventListener("touchstart", handleTouch, { passive: false });
        window.addEventListener("touchmove", handleTouch, { passive: false });
        window.addEventListener("pointerdown", handleTouch, { passive: false });
        window.addEventListener("pointermove", handleTouch, { passive: false });
        window.addEventListener("click", handleTouch, { passive: false });

        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
          canvas.removeEventListener("touchstart", handleTouch);
          canvas.removeEventListener("touchmove", handleTouch);
          canvas.removeEventListener("pointerdown", handleTouch);
          canvas.removeEventListener("pointermove", handleTouch);
          window.removeEventListener("touchstart", handleTouch);
          window.removeEventListener("touchmove", handleTouch);
          window.removeEventListener("pointerdown", handleTouch);
          window.removeEventListener("pointermove", handleTouch);
          window.removeEventListener("click", handleTouch);
        });
      }

      movePaddle(x) {
        const totalHalf = this.getTotalPaddleWidth() / 2;
        const clampedX = Phaser.Math.Clamp(x, 32 + totalHalf, GAME_WIDTH - 32 - totalHalf);

        if (this.twinPaddleActive && this.paddleLeft?.active && this.paddleRight?.active) {
          const halfWidth = this.paddleLeft.displayWidth;
          this.paddleLeft.setPosition(clampedX - halfWidth / 2, PADDLE_Y);
          this.paddleRight.setPosition(clampedX + halfWidth / 2, PADDLE_Y);
          this.paddleLeft.refreshBody();
          this.paddleRight.refreshBody();
          this.paddle.setPosition(clampedX, PADDLE_Y);
        } else {
          this.paddle.setPosition(clampedX, PADDLE_Y);
          this.paddle.refreshBody();
        }

        if (this.ball && this.ball.active && this.ball.getData("attached")) {
          this.ball.setX(clampedX);
        }
      }

      launchBall() {
        this.ball.setData("attached", false);
        this.resetCombo();
        const speed = this.getStageBallSpeed();
        this.ball.setVelocity(Phaser.Math.Between(-130, 130), -speed);
        if (this.startPrompt) {
          this.startPrompt.destroy();
          this.startPrompt = null;
        }
      }

      launchAttachedBall() {
        if (this.gameEnded || this.isPaused || this.transitioningStage || this.respawning) return;
        if (this.ball && this.ball.active && this.ball.getData("attached")) {
          this.launchBall();
        }
      }

      pauseGame() {
        if (this.gameEnded || this.isPaused || this.awaitingRewardAd) return;

        this.isPaused = true;
        this.physics.pause();
        this.time.paused = true;
        this.tweens.pauseAll();
        this.showPausePopup();
      }

      resumeGame() {
        if (!this.isPaused) return;

        if (this.pauseOverlay) {
          this.pauseOverlay.destroy();
          this.pauseOverlay = null;
        }

        this.isPaused = false;
        this.time.paused = false;
        this.tweens.resumeAll();
        if (!this.awaitingRewardAd && !this.gameEnded) {
          this.physics.resume();
        }
      }

      exitPausedGame() {
        clearRunBoost();
        if (this.pauseOverlay) {
          this.pauseOverlay.destroy();
          this.pauseOverlay = null;
        }

        this.isPaused = false;
        this.time.paused = false;
        this.tweens.resumeAll();
        this.physics.resume();
        this.scene.start("MainScene");
      }

      showPausePopup() {
        this.pauseOverlay = this.add.container(0, 0).setDepth(70);
        const overlay = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x03050d, 0.72);
        const card = this.add.graphics();
        this.drawBrickModalCard(card, 44, 278, GAME_WIDTH - 88, 254);
        const title = this.add.text(GAME_WIDTH / 2, 336, "PAUSE", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "32px",
          fontStyle: "900",
          color: "#ffffff",
          stroke: "#081018",
          strokeThickness: 3
        }).setOrigin(0.5);
        const resumeButton = this.addBrickButton(GAME_WIDTH / 2, 414, 224, 52, "Resume", () => this.resumeGame(), {
          depth: 71,
          fontSize: "17px",
          brickTexture: "element_blue_rectangle"
        });
        const exitButton = this.addBrickButton(GAME_WIDTH / 2, 476, 224, 46, "Exit", () => this.exitPausedGame(), {
          depth: 71,
          fontSize: "16px",
          brickTexture: "element_red_rectangle"
        });

        this.pauseOverlay.add([overlay, card, title, resumeButton, exitButton]);
      }

      handlePaddleCollision(ball) {
        if (!ball.active || ball.body.velocity.y <= 0) return;

        this.getPaddleTouchTargets().forEach((paddlePart) => {
          if (this.checkBallPaddleHit(ball, paddlePart)) {
            this.onBallPaddleHit(ball, paddlePart);
          }
        });
      }

      checkBallPaddleHit(ball, paddlePart) {
        const paddleTop = paddlePart.y - paddlePart.displayHeight / 2;
        const paddleBottom = paddlePart.y + paddlePart.displayHeight / 2;
        const ballRadius = Math.max(ball.displayWidth, ball.displayHeight) / 2;
        const ballBottom = ball.y + ballRadius;
        const horizontalReach = paddlePart.displayWidth / 2 + ballRadius;
        const lastFrameY = ball.getData("lastFrameY");
        const lastFrameX = ball.getData("lastFrameX");

        if (Number.isFinite(lastFrameY) && Number.isFinite(lastFrameX)) {
          const minX = paddlePart.x - horizontalReach;
          const maxX = paddlePart.x + horizontalReach;
          const minY = paddleTop - ballRadius;
          const maxY = paddleBottom + ballRadius;
          const hitT = this.getSegmentRectHitTime(lastFrameX, lastFrameY, ball.x, ball.y, minX, minY, maxX, maxY);
          if (hitT !== null) return true;
        }

        return ballBottom >= paddleTop &&
          ball.y <= paddleBottom + ballRadius &&
          Math.abs(ball.x - paddlePart.x) <= horizontalReach;
      }

      onBallPaddleHit(ball, paddlePart) {
        const lastHit = ball.getData("lastPaddleHitAt") || 0;
        if (this.time.now - lastHit < 90) return false;

        ball.setData("lastPaddleHitAt", this.time.now);

        const paddleTop = paddlePart.y - paddlePart.displayHeight / 2;
        const offset = (ball.x - paddlePart.x) / (paddlePart.displayWidth / 2);
        const speed = Math.max(this.getStageBallSpeed(), Math.hypot(ball.body.velocity.x, ball.body.velocity.y));
        const angle = Phaser.Math.Clamp(offset, -0.95, 0.95) * 1.05;
        ball.body.reset(ball.x, paddleTop - ball.displayHeight / 2 - 2);
        ball.setVelocity(Math.sin(angle) * speed, -Math.cos(angle) * speed);
        ball.setData("lastFrameX", ball.x);
        ball.setData("lastFrameY", ball.y);

        this.trySplitBounceFromBall(ball);

        if (this.isInfiniteMode()) {
          this.schedulePaddleDescent();
        }

        return true;
      }

      schedulePaddleDescent() {
        if (this.pendingPaddleDescentTimer || this.bricksDescending || this.transitioningStage || this.respawning || this.gameEnded) return;

        const delay = Math.round(260 * DIFFICULTY_EASE);
        this.nextDescentAt = Math.max(this.nextDescentAt, this.time.now + delay);
        this.pendingPaddleDescentTimer = this.time.delayedCall(delay, () => {
          this.pendingPaddleDescentTimer = null;
          this.descendBlocks("paddle");
        });
      }

      safeHitBrick(ball, brick) {
        try {
          this.hitBrick(ball, brick);
        } catch (error) {
          console.error("Brick collision error", error);
          const fireballHit = ball?.getData?.("fireball") === true;
          const prevVelocity = ball?.getData?.("prevVelocity");
          if (brick?.active) {
            this.forceRemoveBrick(brick);
            this.checkStageClear();
          }
          if (ball?.active && ball.body) {
            if (fireballHit && prevVelocity) {
              ball.setVelocity(prevVelocity.x, prevVelocity.y);
            } else {
              ball.setVelocity(ball.body.velocity.x || 120, -Math.abs(ball.body.velocity.y || this.getStageBallSpeed()));
            }
          }
        }
      }

      handleSweptBrickCollision(ball, fromX, fromY) {
        return this.handleSegmentBrickCollision(ball, fromX, fromY, ball.x, ball.y);
      }

      handleSegmentBrickCollision(ball, fromX, fromY, toX, toY) {
        if (!Number.isFinite(fromX) || !Number.isFinite(fromY)) return;
        if (!ball?.active || !ball.body) return;
        if (!Number.isFinite(toX) || !Number.isFinite(toY)) return;
        const fireballHit = ball.getData("fireball") === true;

        const travelDistance = Phaser.Math.Distance.Between(fromX, fromY, toX, toY);
        if (travelDistance < 0.1) return;

        const radius = Math.max(ball.displayWidth, ball.displayHeight) / 2;
        let closestBrick = this.findOverlappingBrick(ball, radius);
        let closestT = closestBrick ? 1 : Number.POSITIVE_INFINITY;

        this.getActiveBricks().forEach((brick) => {
          if (brick === closestBrick) return;
          const hitT = this.getSegmentRectHitTime(
            fromX,
            fromY,
            toX,
            toY,
            brick.x - brick.displayWidth / 2 - radius,
            brick.y - brick.displayHeight / 2 - radius,
            brick.x + brick.displayWidth / 2 + radius,
            brick.y + brick.displayHeight / 2 + radius
          );

          if (hitT !== null && hitT < closestT) {
            closestT = hitT;
            closestBrick = brick;
          }
        });

        if (!closestBrick) return;

        const hitX = Phaser.Math.Linear(fromX, toX, closestT);
        const hitY = Phaser.Math.Linear(fromY, toY, closestT);
        if (!fireballHit) {
          ball.body.reset(hitX, hitY);
        }
        this.safeHitBrick(ball, closestBrick);
      }

      findOverlappingBrick(ball, radius) {
        return this.getActiveBricks().find((brick) => {
          const closestX = Phaser.Math.Clamp(ball.x, brick.x - brick.displayWidth / 2 - 2, brick.x + brick.displayWidth / 2 + 2);
          const closestY = Phaser.Math.Clamp(ball.y, brick.y - brick.displayHeight / 2 - 2, brick.y + brick.displayHeight / 2 + 2);
          return Phaser.Math.Distance.Squared(ball.x, ball.y, closestX, closestY) <= (radius + 2) * (radius + 2);
        }) || null;
      }

      getSegmentRectHitTime(x1, y1, x2, y2, minX, minY, maxX, maxY) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        let tMin = 0;
        let tMax = 1;

        if (Math.abs(dx) < 0.0001) {
          if (x1 < minX || x1 > maxX) return null;
        } else {
          const tx1 = (minX - x1) / dx;
          const tx2 = (maxX - x1) / dx;
          tMin = Math.max(tMin, Math.min(tx1, tx2));
          tMax = Math.min(tMax, Math.max(tx1, tx2));
        }

        if (Math.abs(dy) < 0.0001) {
          if (y1 < minY || y1 > maxY) return null;
        } else {
          const ty1 = (minY - y1) / dy;
          const ty2 = (maxY - y1) / dy;
          tMin = Math.max(tMin, Math.min(ty1, ty2));
          tMax = Math.min(tMax, Math.max(ty1, ty2));
        }

        return tMax >= tMin ? Phaser.Math.Clamp(tMin, 0, 1) : null;
      }

      hitBrick(ball, brick) {
        const prevVelocity = ball.getData("prevVelocity") || { x: ball.body.velocity.x, y: ball.body.velocity.y };
        const fireballHit = ball.getData("fireball") === true;
        const undersideHit = !fireballHit && this.isBrickUndersideHit(ball, brick, prevVelocity);
        const lastBallHit = ball.getData("lastBrickHitAt") || 0;
        const lastBallHitBrick = ball.getData("lastBrickHitBrick");
        if (!fireballHit && lastBallHitBrick === brick && this.time.now - lastBallHit < 40) {
          if (undersideHit) {
            this.forceBallDownFromBrick(ball, brick, prevVelocity);
          }
          return;
        }
        const lastHit = brick.getData("lastHitAt") || 0;
        if (this.time.now - lastHit < 70) {
          if (undersideHit) {
            this.forceBallDownFromBrick(ball, brick, prevVelocity);
          }
          return;
        }
        brick.setData("lastHitAt", this.time.now);
        ball.setData("lastBrickHitAt", this.time.now);
        ball.setData("lastBrickHitBrick", brick);

        const currentHp = Math.max(1, Number(brick.getData("hp")) || 1);
        const maxHp = Math.max(currentHp, Number(brick.getData("maxHp")) || currentHp);
        brick.setData("maxHp", maxHp);
        const damage = this.getBallHitDamage(ball, brick, fireballHit);
        const passThroughHit = this.shouldBallPassThrough(ball, brick, currentHp, damage, fireballHit);
        const nextHp = Math.max(0, currentHp - damage);
        brick.setData("hp", nextHp);
        playBrickHitSfx(this.settings, maxHp);
        this.showBrickImpactEffect(brick.x, brick.y, this.getShopImpactColor(ball), damage);
        this.cameras.main.shake(100, fireballHit || damage > 1 ? 0.0024 : 0.0018);
        if (!passThroughHit) {
          if (undersideHit) {
            this.forceBallDownFromBrick(ball, brick, prevVelocity);
          } else if (!fireballHit) {
            this.ensureBallBouncedFromBrick(ball, brick, prevVelocity);
          }
        }

        if (nextHp > 0) {
          this.score += 2;
          this.updateScore();
          this.updateBrickHpVisual(brick);
          this.tweens.add({
            targets: brick,
            alpha: 0.55,
            scaleX: 0.9,
            scaleY: 0.9,
            duration: 65,
            yoyo: true,
            onComplete: () => this.updateBrickHpVisual(brick)
          });
          if (undersideHit) {
            this.forceBallDownFromBrick(ball, brick, prevVelocity);
          }
          return;
        }

        this.destroyBrick(brick, true, false);
        if (undersideHit && !passThroughHit) {
          this.forceBallDownFromBrick(ball, brick, prevVelocity);
        }

        if (passThroughHit && prevVelocity) {
          ball.setVelocity(prevVelocity.x, prevVelocity.y);
        }

        this.checkStageClear();
      }

      isBrickUndersideHit(ball, brick, prevVelocity) {
        const prevY = Number(ball.getData("lastFrameY"));
        const prevX = Number(ball.getData("lastFrameX"));
        const brickLeft = brick.x - brick.displayWidth / 2;
        const brickRight = brick.x + brick.displayWidth / 2;
        const brickBottom = brick.y + brick.displayHeight / 2;
        const ballRadius = Math.max(ball.displayWidth, ball.displayHeight) / 2;
        const movingUp = (Number(prevVelocity?.y) || ball.body?.velocity?.y || 0) < 0;
        const horizontallyAligned =
          ball.x + ballRadius >= brickLeft - 8 &&
          ball.x - ballRadius <= brickRight + 8 &&
          (!Number.isFinite(prevX) || (prevX + ballRadius >= brickLeft - 8 && prevX - ballRadius <= brickRight + 8));
        const wasBelow = Number.isFinite(prevY) && prevY + ballRadius >= brickBottom - 10;
        const isBelowCenter = ball.y + ballRadius >= brick.y;

        return movingUp && horizontallyAligned && (wasBelow || isBelowCenter);
      }

      forceBallDownFromBrick(ball, brick, prevVelocity) {
        if (!ball?.active || !ball.body) return;

        const speed = Math.max(this.getStageBallSpeed(), Math.hypot(prevVelocity?.x || 0, prevVelocity?.y || 0), ball.body.velocity.length(), 220);
        const vx = Phaser.Math.Clamp(Number(prevVelocity?.x) || ball.body.velocity.x || 90, -speed * 0.72, speed * 0.72);
        const brickBottom = brick.y + brick.displayHeight / 2;
        const ballRadius = Math.max(ball.displayWidth, ball.displayHeight) / 2;
        const vy = Math.max(260, speed * 0.9);
        const length = Math.max(1, Math.hypot(vx, vy));

        ball.body.reset(ball.x, brickBottom + ballRadius + 8);
        ball.setVelocity((vx / length) * speed, (vy / length) * speed);
        ball.setData("lastFrameX", ball.x);
        ball.setData("lastFrameY", ball.y);
        ball.setData("forceDownUntil", this.time.now + 180);
      }

      enforceForcedBrickBounce(ball) {
        if (!ball?.active || !ball.body) return;
        if (this.time.now > (ball.getData("forceDownUntil") || 0)) return;
        if (ball.body.velocity.y < 80) {
          ball.setVelocityY(Math.max(220, this.getStageBallSpeed() * 0.72));
        }
      }

      ensureBallBouncedFromBrick(ball, brick, prevVelocity) {
        if (!ball?.active || !ball.body || !brick?.active) return;

        const speed = Math.max(this.getStageBallSpeed(), Math.hypot(prevVelocity.x || 0, prevVelocity.y || 0), 220);
        const prevX = Number(ball.getData("lastFrameX"));
        const prevY = Number(ball.getData("lastFrameY"));
        let vx = Number(prevVelocity.x) || ball.body.velocity.x || 120;
        let vy = Number(prevVelocity.y) || ball.body.velocity.y || -speed;
        const brickLeft = brick.x - brick.displayWidth / 2;
        const brickRight = brick.x + brick.displayWidth / 2;
        const brickTop = brick.y - brick.displayHeight / 2;
        const brickBottom = brick.y + brick.displayHeight / 2;
        const ballRadius = Math.max(ball.displayWidth, ball.displayHeight) / 2;
        let nextX = ball.x;
        let nextY = ball.y;
        const cameFromBelow = vy < 0 && Number.isFinite(prevY) && prevY >= brickBottom - 2;
        const cameFromAbove = vy > 0 && Number.isFinite(prevY) && prevY <= brickTop + 2;
        const cameFromLeft = vx > 0 && Number.isFinite(prevX) && prevX <= brickLeft + 2;
        const cameFromRight = vx < 0 && Number.isFinite(prevX) && prevX >= brickRight - 2;

        if (cameFromBelow) {
          vy = Math.abs(vy);
          nextY = brickBottom + ballRadius + 3;
        } else if (cameFromAbove) {
          vy = -Math.abs(vy);
          nextY = brickTop - ballRadius - 3;
        } else if (cameFromLeft) {
          vx = -Math.abs(vx);
          nextX = brickLeft - ballRadius - 3;
        } else if (cameFromRight) {
          vx = Math.abs(vx);
          nextX = brickRight + ballRadius + 3;
        } else {
          const verticalBias = Math.abs(vy) >= Math.abs(vx) * 0.55;
          if (verticalBias) {
            vy = ball.y >= brick.y ? Math.abs(vy) : -Math.abs(vy);
            nextY = ball.y >= brick.y ? brickBottom + ballRadius + 3 : brickTop - ballRadius - 3;
          } else {
            vx = ball.x >= brick.x ? Math.abs(vx) : -Math.abs(vx);
            nextX = ball.x >= brick.x ? brickRight + ballRadius + 3 : brickLeft - ballRadius - 3;
          }
        }

        const length = Math.max(1, Math.hypot(vx, vy));
        ball.body.reset(nextX, nextY);
        ball.setVelocity((vx / length) * speed, (vy / length) * speed);
        ball.setData("lastFrameX", ball.x);
        ball.setData("lastFrameY", ball.y);
      }

      getBrickParticleColor(brick) {
        const textureKey = brick.texture?.key;
        if (brick.getData("special") === "bomb") return 0xff4d5e;
        if (brick.getData("special") === "line") return 0x72f6ff;
        const colorMap = typeof BRICK_PARTICLE_COLORS === "object" ? BRICK_PARTICLE_COLORS : {};
        return colorMap[textureKey] || 0x72f6ff;
      }

      showBrickImpactEffect(x, y, color, intensity = 1) {
        if (!this.textures.exists("particleShard")) return;

        try {
          const shardCount = Math.min(18, Math.floor(10 + intensity * 5));
          for (let i = 0; i < shardCount; i += 1) {
            const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
            const distance = Phaser.Math.Between(26, 72);
            const shard = this.add.image(x, y, "particleShard")
              .setTint(color)
              .setAlpha(0.96)
              .setScale(Phaser.Math.FloatBetween(0.55, 1.05))
              .setRotation(Phaser.Math.FloatBetween(0, Math.PI))
              .setDepth(9);

            this.tweens.add({
              targets: shard,
              x: x + Math.cos(angle) * distance,
              y: y + Math.sin(angle) * distance + Phaser.Math.Between(8, 28),
              alpha: 0,
              scale: 0,
              rotation: shard.rotation + Phaser.Math.FloatBetween(-2.4, 2.4),
              duration: Phaser.Math.Between(180, 320),
              ease: "Quad.easeOut",
              onComplete: () => shard.destroy()
            });
          }

          const burst = this.add.graphics().setDepth(8);
          burst.fillStyle(color, 0.28);
          burst.fillCircle(x, y, 10 + intensity * 2);
          burst.lineStyle(2, 0xffffff, 0.35);
          burst.strokeCircle(x, y, 12 + intensity * 2);
          this.tweens.add({
            targets: burst,
            alpha: 0,
            scaleX: 1.8,
            scaleY: 1.8,
            duration: 220,
            onComplete: () => burst.destroy()
          });
        } catch (error) {
          // 일부 WebView에서 이펙트 생성이 실패해도 게임 진행은 유지한다.
        }
      }

      updateScore() {
        this.scoreText.setText(String(this.score));
        this.updateInfiniteSpeedTier();
        this.best = saveBestStats(this.getRecordStage(), this.score, this.scoreMode);
        this.bestText.setText(this.getBestLabel());
      }

      updateInfiniteSpeedTier() {
        if (!this.isInfiniteMode()) return;

        const nextTier = this.getInfiniteSpeedTier();
        if (nextTier <= this.infiniteSpeedTier) return;

        this.infiniteSpeedTier = nextTier;
        this.showFloatingText(GAME_WIDTH / 2, 114, "DROP SPEED UP");
        this.scheduleNextDescent();
      }

      addScoreForBrick(brick) {
        this.addScoreForBrickValue(brick.getData("maxHp"));
      }

      addScoreForBrickValue(maxHp = 1) {
        this.combo += 1;
        this.comboMultiplier = Math.min(5, 1 + Math.floor(Math.max(0, this.combo - 1) / 3) * 0.25);
        this.score += Math.floor(10 * Math.max(1, Number(maxHp) || 1) * this.comboMultiplier);
        this.rewardComboDelay();
        this.updateScore();
        this.updateComboText();
      }

      resetCombo() {
        this.combo = 0;
        this.comboMultiplier = 1;
        this.updateComboText();
      }

      updateComboText() {
        if (!this.comboText) return;
        this.comboText.setText(this.combo >= 2 ? `COMBO x${this.comboMultiplier.toFixed(2)}` : "");
      }

      rewardComboDelay() {
        if (this.combo < 2) return;
        const delay = Math.min(1800, 150 * this.combo) * DIFFICULTY_EASE;
        this.nextDescentAt += delay;
        this.showFloatingText(GAME_WIDTH / 2, 114, `+${(delay / 1000).toFixed(1)}s`);
      }

      updateLives() {
        this.lifeText.setText("♥ ".repeat(this.lives).trim());
      }

      addCoin(amount = 1) {
        if (!amount) return;
        let payout = amount;
        if (this.isInfiniteMode()) {
          payout = Math.max(0, Math.round(amount * INFINITE_COIN_SCALE));
          const remaining = INFINITE_RUN_COIN_CAP - (this.runCoinsEarned || 0);
          payout = Math.min(payout, remaining);
        } else {
          const remaining = STAGE_COIN_CAP - (this.stageCoinsEarned || 0);
          payout = Math.min(payout, remaining);
        }
        if (!payout) return;
        if (this.isInfiniteMode()) {
          this.runCoinsEarned = (this.runCoinsEarned || 0) + payout;
        } else {
          this.stageCoinsEarned = (this.stageCoinsEarned || 0) + payout;
        }
        this.coins = saveCoins(this.coins + payout);
        if (this.coinText) {
          this.coinText.setText(`코인 ${this.coins}`);
        }
      }

      getStageBallSpeed() {
        return BASE_BALL_SPEED * this.speedMultiplier * GLOBAL_DIFFICULTY_SCALE;
      }

      getBrickHp() {
        const progressLevel = this.isInfiniteMode() ? this.getInfiniteSpeedTier() + 1 : this.stage;
        if (progressLevel === 1) return 1;
        const difficulty = DIFFICULTIES[this.settings.difficulty] || DIFFICULTIES.normal;
        const maxHp = Phaser.Math.Clamp(1 + Math.floor(progressLevel * GLOBAL_DIFFICULTY_SCALE), 2, Math.max(2, Math.round(6 * GLOBAL_DIFFICULTY_SCALE + 1)));
        const durableChance = Phaser.Math.Clamp((0.18 + progressLevel * 0.06 + difficulty.hpBias) * GLOBAL_DIFFICULTY_SCALE, 0.08, 0.4);
        return Math.random() < durableChance ? Phaser.Math.Between(2, maxHp) : 1;
      }

      updateBrickHpVisual(brick) {
        const hp = brick.getData("hp");
        const maxHp = brick.getData("maxHp");
        brick.setAlpha(0.72 + (hp / maxHp) * 0.24);
      }

      destroyBrick(brick, award = true, skipSpecial = false) {
        if (!brick || !brick.active) return;

        const x = brick.x;
        const y = brick.y;
        const row = brick.getData("row");
        const col = brick.getData("col");
        const special = brick.getData("special");
        const label = brick.getData("specialLabel");
        const maxHp = brick.getData("maxHp");

        if (label) {
          label.destroy();
        }

        this.forceRemoveBrick(brick);

        if (award) {
          this.addScoreForBrickValue(maxHp);
          this.addCoin(getBrickCoinReward(maxHp));
          this.maybeDropPowerUp(x, y, maxHp);
          if (!this.isInfiniteMode()) {
            incrementDailyMissionBricks();
          }
        }

        if (skipSpecial) return;

        if (special === "bomb") {
          this.explodeBomb(row, col);
        } else if (special === "line") {
          this.clearBrickLine(row);
        }
      }

      forceRemoveBrick(brick) {
        if (!brick) return;

        try {
          if (brick.body && typeof brick.disableBody === "function") {
            brick.disableBody(true, true);
          }

          if (this.bricks && typeof this.bricks.remove === "function") {
            this.bricks.remove(brick, true, true);
          } else if (brick.active || brick.scene) {
            brick.destroy();
          }
        } catch (error) {
          console.error("Brick remove error", error);
          if (brick.active || brick.scene) {
            brick.destroy();
          }
        }
      }

      explodeBomb(row, col) {
        this.cameras.main.shake(140, 0.006);
        this.getActiveBricks().forEach((brick) => {
          const rowDistance = Math.abs(brick.getData("row") - row);
          const colDistance = Math.abs(brick.getData("col") - col);

          if (rowDistance <= 1 && colDistance <= 1) {
            this.destroyBrick(brick, true, true);
          }
        });
      }

      clearBrickLine(row) {
        this.showFloatingText(GAME_WIDTH / 2, BRICK_START_Y + row * BRICK_ROW_STEP, "LINE CLEAR!");
        this.getActiveBricks().forEach((brick) => {
          if (brick.getData("row") === row) {
            this.destroyBrick(brick, true, true);
          }
        });
      }

      getActiveBricks() {
        return this.bricks.getChildren().filter((brick) => this.isPlayableBrick(brick));
      }

      countActiveBricks() {
        return this.getActiveBricks().length;
      }

      isPlayableBrick(brick) {
        return Boolean(brick && brick.active && brick.visible && (!brick.body || brick.body.enable !== false));
      }

      checkStageClear() {
        if (this.transitioningStage || this.respawning || this.gameEnded) return;
        if (this.countActiveBricks() > 0) return;

        if (this.isInfiniteMode()) {
          this.generateTopBrickLine();
          this.scheduleNextDescent();
        } else {
          this.startNextStage();
        }
      }

      getDescentInterval() {
        if (this.isInfiniteMode()) {
          const interval = 15000 * Math.pow(0.8, this.getInfiniteSpeedTier()) * DIFFICULTY_EASE;
          return Phaser.Math.Clamp(interval, 3000 * DIFFICULTY_EASE, 15000 * DIFFICULTY_EASE);
        }

        const accelerated = (15000 - this.descentCount * 1000) * DIFFICULTY_EASE;
        return Phaser.Math.Clamp(accelerated, 6750 * DIFFICULTY_EASE, 15000 * DIFFICULTY_EASE);
      }

      scheduleNextDescent() {
        this.nextDescentAt = this.time.now + this.getDescentInterval();
      }

      descendBlocks(reason) {
        if (this.bricksDescending || this.transitioningStage || this.respawning || this.gameEnded) return;
        if (this.pendingPaddleDescentTimer && reason !== "paddle") {
          this.pendingPaddleDescentTimer.remove(false);
          this.pendingPaddleDescentTimer = null;
        }

        const activeBricks = this.getActiveBricks();

        if (activeBricks.length === 0) {
          this.generateTopBrickLine();
          this.scheduleNextDescent();
          return;
        }

        this.bricksDescending = true;
        this.descentCount += 1;

        let completed = 0;
        const total = activeBricks.length;

        activeBricks.forEach((brick) => {
          const label = brick.getData("specialLabel");
          const targets = label ? [brick, label] : [brick];

          brick.setData("row", brick.getData("row") + 1);

          this.tweens.add({
            targets,
            y: `+=${BRICK_ROW_STEP}`,
            duration: 390,
            ease: "Sine.easeInOut",
            onUpdate: () => {
              if (brick.active) {
                brick.refreshBody();
              }
            },
            onComplete: () => {
              if (brick.active) {
                brick.refreshBody();
              }

              completed += 1;

              if (completed === total) {
                this.cleanupOutOfBoundsBricks();
                this.generateTopBrickLine();
                this.bricksDescending = false;
                this.checkDangerLine();
                this.scheduleNextDescent();
              }
            }
          });
        });
      }

      generateTopBrickLine() {
        const filledCols = new Set(
          this.getActiveBricks()
            .filter((brick) => brick.getData("row") === 0)
            .map((brick) => brick.getData("col"))
        );

        for (let col = 0; col < BRICK_COLS; col += 1) {
          if (filledCols.has(col)) continue;
          this.createBrickAt(0, col);
        }
      }

      cleanupOutOfBoundsBricks() {
        this.getActiveBricks().forEach((brick) => {
          if (brick.y - brick.displayHeight / 2 > GAME_HEIGHT) {
            const label = brick.getData("specialLabel");
            if (label) label.destroy();
            brick.destroy();
          }
        });
      }

      checkDangerLine() {
        const dangerReached = this.getActiveBricks().some((brick) => {
          return brick.y + brick.displayHeight / 2 >= DANGER_LINE_Y;
        });

        if (dangerReached) {
          this.endGame();
        }
      }

      maybeDropPowerUp(x, y, brickHp) {
        if (this.gameEnded || this.transitioningStage) return;
        const dropChance = Phaser.Math.Clamp(0.2 * DIFFICULTY_EASE, 0.2, 0.45);
        if (Math.random() > dropChance) return;

        const excludedEffects = this.canDropFireballPowerUp() ? [] : ["fireball"];
        const powerUpInfo = pickRandomPowerUp(excludedEffects);
        if (!powerUpInfo) return;

        const powerUp = this.powerUps.create(x, y, powerUpInfo.texture).setDisplaySize(34, 34).setDepth(7);
        powerUp.body.allowGravity = false;
        powerUp.setVelocityY(125);
        powerUp.setData("type", "itemBox");
        powerUp.setData("effect", powerUpInfo.effect);
        powerUp.setData("label", powerUpInfo.label);

        if (powerUpInfo.effect === "fireball") {
          this.markFireballPowerUpDropped();
        }
      }

      canDropFireballPowerUp() {
        if (this.isInfiniteMode()) {
          return false;
        }

        return !this.fireballDroppedThisStage;
      }

      markFireballPowerUpDropped() {
        if (this.isInfiniteMode()) {
          this.lastFireballDropAt = this.time.now;
          return;
        }

        this.fireballDroppedThisStage = true;
      }

      collectPowerUp(paddle, powerUp) {
        if (!powerUp.active) return;
        const effect = powerUp.getData("effect");
        const label = powerUp.getData("label") || "POWER UP!";
        const effectColors = {
          expand: "#5cff9d",
          multiBall: "#72f6ff",
          fireball: "#ff6b2f"
        };

        powerUp.destroy();
        this.addCoin(3);
        this.showFloatingText(this.paddle.x, this.paddle.y - 52, label, effectColors[effect] || "#72f6ff", 20);
        this.flashPowerUpRing(effectColors[effect] || "#72f6ff");

        if (effect === "expand") {
          this.activatePaddleExpand(false);
        } else if (effect === "multiBall") {
          this.activateMultiBall(false);
        } else {
          this.activateFireball(false);
        }
      }

      flashPowerUpRing(colorCss) {
        const ring = this.add.graphics().setDepth(13);
        ring.lineStyle(3, Phaser.Display.Color.HexStringToColor(colorCss).color, 0.85);
        ring.strokeCircle(this.paddle.x, this.paddle.y, 28);
        ring.fillStyle(Phaser.Display.Color.HexStringToColor(colorCss).color, 0.12);
        ring.fillCircle(this.paddle.x, this.paddle.y, 34);
        this.tweens.add({
          targets: ring,
          alpha: 0,
          scaleX: 1.7,
          scaleY: 1.7,
          duration: 420,
          ease: "Sine.easeOut",
          onComplete: () => ring.destroy()
        });
      }

      activatePaddleExpand(showBanner = true) {
        if (showBanner) {
          this.showFloatingText(this.paddle.x, this.paddle.y - 44, "PADDLE UP!", "#5cff9d", 18);
        }
        this.setPaddleWidth(PADDLE_EXPAND_WIDTH);
        this.paddleExpanded = true;
        if (this.twinPaddleActive && this.paddleLeft?.active && this.paddleRight?.active) {
          this.paddleLeft.setTint(0x9dffb8);
          this.paddleRight.setTint(0x9dffb8);
        } else {
          this.paddle.setTint(0x9dffb8);
        }

        if (this.paddleExpandTimer) {
          this.paddleExpandTimer.remove(false);
        }

        this.paddleExpandTimer = this.time.delayedCall(Math.round(5000 * DIFFICULTY_EASE), () => {
          this.setPaddleWidth(PADDLE_WIDTH);
          this.paddleExpanded = false;
          if (this.twinPaddleActive && this.paddleLeft?.active && this.paddleRight?.active) {
            this.paddleLeft.clearTint();
            this.paddleRight.clearTint();
          } else {
            this.paddle.clearTint();
          }
          this.paddleExpandTimer = null;
        });
      }

      setPaddleWidth(width) {
        if (this.twinPaddleActive && this.paddleLeft?.active && this.paddleRight?.active) {
          const halfWidth = width / 2;
          this.paddleLeft.setDisplaySize(halfWidth, PADDLE_HEIGHT);
          this.paddleRight.setDisplaySize(halfWidth, PADDLE_HEIGHT);
          this.paddleLeft.refreshBody();
          this.paddleRight.refreshBody();
          this.paddleLeft.body.setSize(this.paddleLeft.width, this.paddleLeft.height * 0.62, true);
          this.paddleRight.body.setSize(this.paddleRight.width, this.paddleRight.height * 0.62, true);
          this.applyPaddleVisual(width);
          this.movePaddle(this.paddle.x);
          return;
        }

        this.paddle.setDisplaySize(width, PADDLE_HEIGHT);
        this.paddle.refreshBody();
        this.paddle.body.setSize(this.paddle.width, this.paddle.height * 0.62, true);
        if (this.paddleItemId) {
          this.applyPaddleVisual(width);
        }
      }

      activateFireball(showBanner = true) {
        this.fireballActive = true;
        if (showBanner) {
          this.showFloatingText(this.paddle.x, this.paddle.y - 44, "FIREBALL!", "#ff6b2f", 20);
        }
        this.balls.children.each((ball) => this.setBallFireball(ball, true));

        if (this.fireballTimer) {
          this.fireballTimer.remove(false);
        }

        this.fireballTimer = this.time.delayedCall(Math.round(5000 * DIFFICULTY_EASE), () => {
          this.fireballActive = false;
          this.balls.children.each((ball) => this.setBallFireball(ball, false));
          this.fireballTimer = null;
        });
      }

      setBallFireball(ball, active) {
        if (!ball || !ball.active) return;
        ball.setData("fireball", active);
        if (active) {
          if (this.textures.exists("shopBall_blaze")) {
            ball.setTexture("shopBall_blaze");
          }
          ball.setTint(0xffaa66);
          ball.setDisplaySize(Math.max(ball.displayWidth, BALL_FIREBALL_MIN_SIZE), Math.max(ball.displayHeight, BALL_FIREBALL_MIN_SIZE));
          return;
        }
        this.applyShopBallStyle(ball);
      }

      countActiveBalls() {
        return this.balls.getChildren().filter((ball) => ball.active).length;
      }

      getMaxActiveBalls() {
        return this.isInfiniteMode() ? INFINITE_MAX_ACTIVE_BALLS : MAX_ACTIVE_BALLS;
      }

      getMultiBallSpawnAngles(count, sourceAngle) {
        if (count <= 1) return [sourceAngle - 0.45];
        if (count === 2) return [sourceAngle - 0.45, sourceAngle + 0.45];
        return [sourceAngle - 0.45, sourceAngle, sourceAngle + 0.45];
      }

      activateMultiBall(showBanner = true) {
        const source = this.balls.getChildren().find((ball) => ball.active && !ball.getData("attached") && ball.body.velocity.length() > 0);
        const maxBalls = this.getMaxActiveBalls();
        if (!source || this.countActiveBalls() >= maxBalls) return;

        if (!this.isInfiniteMode() && this.countActiveBalls() >= 3) {
          if (showBanner) {
            this.showFloatingText(source.x, source.y - 28, "MULTI BALL!", "#72f6ff", 18);
          }
          return;
        }

        const speed = Math.max(this.getStageBallSpeed(), source.body.velocity.length());
        const sourceAngle = source.body.velocity.y > 0
          ? -Math.PI / 2
          : Phaser.Math.Angle.Between(0, 0, source.body.velocity.x, source.body.velocity.y);
        const ballsToAdd = this.isInfiniteMode()
          ? (this.countActiveBalls() < 3 ? Math.max(0, 3 - this.countActiveBalls()) : 3)
          : Math.max(0, 3 - this.countActiveBalls());
        const angles = this.getMultiBallSpawnAngles(ballsToAdd, sourceAngle);

        angles.forEach((angle) => {
          if (this.countActiveBalls() >= maxBalls) return;
          this.createBall(source.x, source.y, false, {
            x: Math.cos(angle) * speed,
            y: Math.sin(angle) * speed
          });
        });
        if (showBanner) {
          this.showFloatingText(source.x, source.y - 28, "MULTI BALL!", "#72f6ff", 18);
        }
      }

      loseLife() {
        if (this.respawning || this.gameEnded) return;

        this.respawning = true;
        this.lives -= 1;
        this.updateLives();
        this.cameras.main.shake(220, 0.01);

        if (this.lives <= 0) {
          this.offerRewardedHeartRefill();
          return;
        }

        this.resetCombo();
        this.clearTemporaryEffects();
        this.resetBallAndPaddle();
        if (this.isInfiniteMode()) {
          this.scheduleNextDescent();
        }
        this.showStartPrompt("하트 -1", "터치해서 다시 시작");
        this.respawning = false;
      }

      clearTemporaryEffects() {
        if (this.pendingPaddleDescentTimer) {
          this.pendingPaddleDescentTimer.remove(false);
          this.pendingPaddleDescentTimer = null;
        }

        if (this.paddleExpandTimer) {
          this.paddleExpandTimer.remove(false);
          this.paddleExpandTimer = null;
        }

        if (this.fireballTimer) {
          this.fireballTimer.remove(false);
          this.fireballTimer = null;
        }

        this.fireballActive = false;
        this.paddleExpanded = false;
        if (this.paddleItemId !== "twinPaddle") {
          this.teardownTwinPaddles();
        }
        this.setPaddleWidth(PADDLE_WIDTH);
        if (this.paddleBullets) {
          this.paddleBullets.clear(true, true);
        }
      }

      offerRewardedHeartRefill() {
        if (this.awaitingRewardAd || this.gameEnded) return;

        this.awaitingRewardAd = true;
        this.rewardAdInProgress = false;
        this.clearTemporaryEffects();
        this.resetCombo();
        this.resetBallAndPaddle();
        this.physics.pause();

        this.rewardOverlay = this.add.container(0, 0).setDepth(30);
        const overlay = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x03050d, 0.7);
        const card = this.add.graphics();
        card.fillStyle(0x11182b, 0.96);
        card.lineStyle(1, 0xffffff, 0.14);
        card.fillRoundedRect(40, 300, GAME_WIDTH - 80, 244, 28);
        card.strokeRoundedRect(40, 300, GAME_WIDTH - 80, 244, 28);
        const title = this.add.text(GAME_WIDTH / 2, 348, "하트가 부족합니다", {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "24px",
          fontStyle: "900",
          color: "#ff7f9f"
        }).setOrigin(0.5);
        const desc = this.add.text(GAME_WIDTH / 2, 394, `보상형 광고를 보고 하트 ${STARTING_LIVES}개를 회복할까요?`, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: "14px",
          color: "#aebbf0",
          align: "center"
        }).setOrigin(0.5);
        const watchButton = this.addButton(GAME_WIDTH / 2, 456, 238, 50, "광고 보고 계속하기", () => this.watchRewardAdForHearts(), {
          depth: 31,
          fontSize: "16px",
          fill: 0x2f8cff,
          alpha: 0.34,
          stroke: 0x72f6ff,
          strokeAlpha: 0.45
        });
        const endButton = this.addButton(GAME_WIDTH / 2, 512, 238, 42, "게임 종료", () => this.endGame({ showInterstitial: false }), {
          depth: 31,
          fontSize: "14px"
        });

        this.rewardOverlay.add([overlay, card, title, desc, watchButton, endButton]);
      }

      async watchRewardAdForHearts() {
        if (!this.awaitingRewardAd || this.rewardAdInProgress) return;

        this.rewardAdInProgress = true;
        const watched = await AdService.showRewarded();

        if (!watched) {
          this.rewardAdInProgress = false;
          this.showFloatingText(GAME_WIDTH / 2, 278, "광고를 완료하지 못했습니다.");
          return;
        }

        if (this.rewardOverlay) {
          this.rewardOverlay.destroy();
          this.rewardOverlay = null;
        }

        this.lives = STARTING_LIVES;
        this.updateLives();
        this.awaitingRewardAd = false;
        this.rewardAdInProgress = false;
        this.respawning = false;
        this.physics.resume();
        this.showStartPrompt("하트 회복!", "터치해서 이어서 시작");
      }

      startNextStage() {
        if (this.isInfiniteMode()) {
          this.generateTopBrickLine();
          this.scheduleNextDescent();
          return;
        }

        if (this.transitioningStage || this.gameEnded) return;
        this.transitioningStage = true;
        this.balls.children.each((ball) => { if (ball.active) ball.setVelocity(0, 0); });
        this.powerUps.clear(true, true);
        const message = this.showStageMessage(`Stage ${this.stage} Clear`, "다음 스테이지 준비 중...");

        this.time.delayedCall(950, () => {
          const clearedStage = this.stage;
          message.destroy();
          if (this.shouldShowStageInterstitial(clearedStage)) {
            AdService.showInterstitial();
          }
          if (!this.isInfiniteMode()) {
            this.addCoin(STAGE_CLEAR_COIN_BONUS);
            this.showFloatingText(GAME_WIDTH / 2, 100, `+${STAGE_CLEAR_COIN_BONUS} 코인`);
          }
          this.stage += 1;
          this.fireballDroppedThisStage = false;
          this.stageCoinsEarned = 0;
          const speedBoost = 1 + (Phaser.Math.FloatBetween(1.05, 1.1) - 1) * GLOBAL_DIFFICULTY_SCALE;
          this.speedMultiplier *= speedBoost;
          this.stageText.setText(this.getStageLabel());
          this.best = saveBestStats(this.getRecordStage(), this.score, this.scoreMode);
          this.bestText.setText(this.getBestLabel());
          this.applyRandomBackground();
          this.createBricks();
          this.resetBallAndPaddle();
          this.resetCombo();
          this.transitioningStage = false;
          this.showStartPrompt(this.getStageLabel(), "터치해서 다음 스테이지 시작");
        });
      }

      shouldShowStageInterstitial(clearedStage) {
        return !this.isInfiniteMode() && clearedStage > 0 && clearedStage % STAGE_INTERSTITIAL_INTERVAL === 0;
      }

      resetBallAndPaddle() {
        this.paddle.setPosition(GAME_WIDTH / 2, PADDLE_Y);
        this.paddle.refreshBody();
        if (this.twinPaddleActive) {
          this.movePaddle(GAME_WIDTH / 2);
        }
        this.balls.clear(true, true);
        this.powerUps.clear(true, true);
        if (this.paddleBullets) {
          this.paddleBullets.clear(true, true);
        }
        this.ball = this.createBall(GAME_WIDTH / 2, PADDLE_Y - BALL_ATTACH_OFFSET_Y, true);
      }

      showStartPrompt(titleText, descText) {
        this.startPrompt = this.add.container(GAME_WIDTH / 2, 482).setDepth(12);
        const card = this.add.graphics();
        card.fillStyle(0x11182b, 0.88);
        card.lineStyle(1, 0xffffff, 0.12);
        card.fillRoundedRect(-132, -46, 264, 92, 22);
        card.strokeRoundedRect(-132, -46, 264, 92, 22);
        const title = this.add.text(0, -13, titleText, { fontFamily: "Inter, Arial, sans-serif", fontSize: "22px", fontStyle: "900", color: "#ffffff" }).setOrigin(0.5);
        const desc = this.add.text(0, 20, descText, { fontFamily: "Inter, Arial, sans-serif", fontSize: "13px", color: "#aebbf0" }).setOrigin(0.5);
        this.startPrompt.add([card, title, desc]);
      }

      showStageMessage(titleText, descText) {
        const message = this.add.container(GAME_WIDTH / 2, 482).setDepth(15);
        const card = this.add.graphics();
        card.fillStyle(0x11182b, 0.9);
        card.lineStyle(1, 0xffffff, 0.12);
        card.fillRoundedRect(-132, -46, 264, 92, 22);
        card.strokeRoundedRect(-132, -46, 264, 92, 22);
        const title = this.add.text(0, -13, titleText, { fontFamily: "Inter, Arial, sans-serif", fontSize: "22px", fontStyle: "900", color: "#72f6ff" }).setOrigin(0.5);
        const desc = this.add.text(0, 20, descText, { fontFamily: "Inter, Arial, sans-serif", fontSize: "13px", color: "#aebbf0" }).setOrigin(0.5);
        message.add([card, title, desc]);
        return message;
      }

      showFloatingText(x, y, text, color = "#72f6ff", fontSize = 16) {
        const label = this.add.text(x, y, text, {
          fontFamily: "Inter, Arial, sans-serif",
          fontSize: `${fontSize}px`,
          fontStyle: "900",
          color,
          stroke: "#11182b",
          strokeThickness: 4
        }).setOrigin(0.5).setDepth(14);
        this.tweens.add({
          targets: label,
          y: y - 38,
          scaleX: 1.08,
          scaleY: 1.08,
          alpha: 0,
          duration: 760,
          ease: "Sine.easeOut",
          onComplete: () => label.destroy()
        });
      }

      endGame(options = {}) {
        if (this.gameEnded) return;
        clearRunBoost();
        this.stopCannonPaddleAutoFire();
        const showInterstitial = options.showInterstitial !== false;
        this.gameEnded = true;
        this.awaitingRewardAd = false;
        if (this.rewardOverlay) {
          this.rewardOverlay.destroy();
          this.rewardOverlay = null;
        }
        this.best = saveBestStats(this.getRecordStage(), this.score, this.scoreMode);
        postScore(this.playerName, this.score, this.getRecordStage(), this.scoreMode).catch(() => {});
        this.physics.pause();
        if (showInterstitial) {
          AdService.showInterstitial();
        }
        this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x03050d, 0.66).setDepth(20);
        this.addCard(GAME_WIDTH / 2, 402, 310, 252, 21);
        this.add.text(GAME_WIDTH / 2, 332, "GAME OVER", { fontFamily: "Inter, Arial, sans-serif", fontSize: "32px", fontStyle: "900", color: "#ff7f9f" }).setOrigin(0.5).setDepth(22);
        this.add.text(GAME_WIDTH / 2, 386, `${this.getStageLabel()} · ${this.score}점`, { fontFamily: "Inter, Arial, sans-serif", fontSize: "18px", fontStyle: "800", color: "#ffffff" }).setOrigin(0.5).setDepth(22);
        this.add.text(GAME_WIDTH / 2, 422, "점수를 랭킹 서버로 전송했습니다.", { fontFamily: "Inter, Arial, sans-serif", fontSize: "13px", color: "#aebbf0" }).setOrigin(0.5).setDepth(22);
        this.addButton(GAME_WIDTH / 2, 478, 232, 52, "메인으로", () => this.scene.start("MainScene"), { depth: 22 });
      }

      shuffleArray(items) {
        for (let index = items.length - 1; index > 0; index -= 1) {
          const swapIndex = Phaser.Math.Between(0, index);
          [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
        }
        return items;
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: "game",
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: "#070a14",
      physics: {
        default: "arcade",
        arcade: { debug: false }
      },
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: GAME_WIDTH,
        height: GAME_HEIGHT
      },
      input: {
        activePointers: 3,
        touch: {
          capture: true
        },
        mouse: {
          capture: true
        }
      },
      scene: [BootScene, MainScene, GameScene]
    };

    window.addEventListener("load", () => {
      window.brickBreakerGame = new Phaser.Game(config);
      requestAnimationFrame(() => window.brickBreakerGame?.scale?.refresh());
    });
  </script>
</body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <radialGradient id="cCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7af0ff"/>
      <stop offset="100%" stop-color="#3ec7e8"/>
    </radialGradient>
    <linearGradient id="cGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#f0a820"/>
    </linearGradient>
  </defs>
  <!-- soft shadow -->
  <ellipse cx="48" cy="86" rx="28" ry="6" fill="#000" opacity=".18"/>
  <!-- chubby body -->
  <path d="M18 70 C20 42 30 30 48 28 C66 30 76 42 78 70 C70 82 26 82 18 70Z" fill="url(#cGold)" stroke="#d88810" stroke-width="3"/>
  <!-- belly highlight -->
  <ellipse cx="48" cy="58" rx="18" ry="14" fill="#fff3c4" opacity=".55"/>
  <!-- face panel -->
  <ellipse cx="48" cy="52" rx="16" ry="14" fill="url(#cCore)" stroke="#2bb3d0" stroke-width="2"/>
  <!-- sparkly eyes -->
  <ellipse cx="41" cy="50" rx="4.2" ry="5" fill="#1a3040"/>
  <ellipse cx="55" cy="50" rx="4.2" ry="5" fill="#1a3040"/>
  <circle cx="39.8" cy="48.2" r="1.4" fill="#fff"/>
  <circle cx="53.8" cy="48.2" r="1.4" fill="#fff"/>
  <!-- blush + smile -->
  <ellipse cx="34" cy="56" rx="3" ry="1.6" fill="#ff9ab5" opacity=".7"/>
  <ellipse cx="62" cy="56" rx="3" ry="1.6" fill="#ff9ab5" opacity=".7"/>
  <path d="M44 58 Q48 62 52 58" stroke="#1a3040" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- cute ears / side bolts -->
  <circle cx="20" cy="54" r="5" fill="#ffd56a" stroke="#d88810" stroke-width="2"/>
  <circle cx="76" cy="54" r="5" fill="#ffd56a" stroke="#d88810" stroke-width="2"/>
  <!-- antenna -->
  <path d="M48 28 V16" stroke="#d88810" stroke-width="3" stroke-linecap="round"/>
  <circle cx="48" cy="12" r="5" fill="#7af0ff" stroke="#2bb3d0" stroke-width="2"/>
  <circle cx="46.5" cy="10.5" r="1.4" fill="#fff"/>
  <!-- tiny arms -->
  <path d="M22 66 Q12 70 16 78" stroke="#d88810" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M74 66 Q84 70 80 78" stroke="#d88810" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>

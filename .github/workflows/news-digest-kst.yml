# LOUNGE 뉴스 다이제스트 — KST 03·09·15·21시(각 UTC 18·0·6·12시 정각)에 슬롯별 호출
# Secrets: CRON_SITE_URL (예: https://www.aisleshub.com), CRON_SECRET
# (저장소 `vercel.json`에는 news-digest 크론을 두지 않음 — Vercel Cron 비활성화 시에도 이 워크플로만으로 발송)
name: News digest — LOUNGE (KST 4 slots)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'KST 슬롯 (0=전일21~03, 1=03~09, 2=09~15, 3=15~21)'
        type: choice
        options: ['0', '1', '2', '3']
        required: true
        default: '0'
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/news-digest
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            SLOT="${MANUAL_SLOT}"
          else
            case "${EVENT_SCHEDULE}" in
              '0 18 * * *') SLOT=0 ;;
              '0 0 * * *') SLOT=1 ;;
              '0 6 * * *') SLOT=2 ;;
              '0 12 * * *') SLOT=3 ;;
              *)
                echo "Unknown schedule: ${EVENT_SCHEDULE:-}" >&2
                exit 1
                ;;
            esac
          fi
          curl -sS -X POST "${CRON_SITE_URL}/api/cron/news-digest?slot=${SLOT}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"

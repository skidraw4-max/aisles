# LOUNGE 뉴스 다이제스트 — KST 06·18시(각 UTC 21·9시 정각)에 슬롯별 호출
# Secrets: CRON_SITE_URL (예: https://www.aisleshub.com), CRON_SECRET
# (저장소 `vercel.json`에는 news-digest 크론을 두지 않음 — Vercel Cron 비활성화 시에도 이 워크플로만으로 발송)
name: News digest — LOUNGE (KST 2 slots)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'KST 슬롯 (0=전일18~06, 1=06~18)'
        type: choice
        options: ['0', '1']
        required: true
        default: '0'
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/news-digest
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            SLOT="${MANUAL_SLOT}"
          else
            case "${EVENT_SCHEDULE}" in
              '0 21 * * *') SLOT=0 ;;
              '0 9 * * *') SLOT=1 ;;
              *)
                echo "Unknown schedule: ${EVENT_SCHEDULE:-}" >&2
                exit 1
                ;;
            esac
          fi
          curl -fsS -X POST "${CRON_SITE_URL}/api/cron/news-digest?slot=${SLOT}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"

      - name: Notify cron failure
        if: failure()
        env:
          CRON_ALERT_WEBHOOK_URL: ${{ secrets.CRON_ALERT_WEBHOOK_URL }}
        run: |
          MSG="[AIsle cron] News digest workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "${CRON_ALERT_WEBHOOK_URL:-}" ]; then
            echo "[cron-alert] CRON_ALERT_WEBHOOK_URL unset — $MSG"
            exit 0
          fi
          curl -fsS -X POST "$CRON_ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":$(printf '%s' "$MSG" | jq -Rs .)}" || echo "[cron-alert] webhook POST failed"

# 외부 스케줄러용: 수집 API를 Vercel Cron 대신 주기 호출
# 필요 Secrets: CRON_SITE_URL (예: https://www.aisleshub.com), CRON_SECRET
# vercel.json 크론과 동시에 쓰면 중복 실행되므로 한쪽만 사용할 것.
#
# ⚠️ 실패한 Run의 "Re-run jobs"는 당시 커밋 SHA를 그대로 씁니다 (최신 main 아님).
#    최신 스크립트로 돌리려면 Actions → 이 워크플로 → "Run workflow" (workflow_dispatch).
#    로그에 CRON_SYNC_STEP_VERSION=2 와 checkout SHA가 보이면 최신입니다.
#
# 실패 조건: HTTP >= 400 (Verge/MIT 504 제외) 또는 ok=false 만. created=0 은 경고 후 통과.
#
# 스케줄: UTC 매 3시간 0분에 시작 → 각 소스 10분 간격(총 약 60분 + 요청 시간; Techmeme는 Lobsters 직후)
name: External cron — news sync chain

on:
  workflow_dispatch:
  schedule:
    # UTC 0,3,6,9,12,15,18,21 시 정각 (vercel.json 의 geeknews 첫 슬롯과 동일 계열)
    - cron: '0 */3 * * *'

jobs:
  sync-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Show checkout commit SHA
        run: |
          echo "GITHUB_SHA=${{ github.sha }}"
          git rev-parse HEAD
          git log -1 --oneline

      - name: GeekNews
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh GeekNews /api/cron/geeknews

      - name: Wait 10 minutes
        run: sleep 600

      - name: Hacker News
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh "Hacker News" /api/cron/hackernews

      - name: Wait 10 minutes
        run: sleep 600

      - name: Lobsters
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh Lobsters /api/cron/lobsters

      - name: Wait 10 minutes
        run: sleep 600

      - name: Techmeme
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh Techmeme /api/cron/techmeme

      - name: Wait 10 minutes
        run: sleep 600

      - name: The Verge
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh "The Verge" /api/cron/verge

      - name: Wait 10 minutes
        run: sleep 600

      - name: AI Breakfast
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh "AI Breakfast" /api/cron/aibreakfast

      - name: Wait 10 minutes
        run: sleep 600

      - name: MIT News
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh "MIT News" /api/cron/mit-news

      - name: Wait 10 minutes
        run: sleep 600

      - name: YouTube sync
        env:
          CRON_SITE_URL: ${{ secrets.CRON_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/cron-news-sync-step.sh "YouTube sync" /api/cron/youtube-sync

      - name: Notify cron failure
        if: failure()
        env:
          CRON_ALERT_WEBHOOK_URL: ${{ secrets.CRON_ALERT_WEBHOOK_URL }}
        run: |
          MSG="[AIsle cron] External news chain failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "${CRON_ALERT_WEBHOOK_URL:-}" ]; then
            echo "[cron-alert] CRON_ALERT_WEBHOOK_URL unset — $MSG"
            exit 0
          fi
          curl -fsS -X POST "$CRON_ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":$(printf '%s' "$MSG" | jq -Rs .)}" || echo "[cron-alert] webhook POST failed"
